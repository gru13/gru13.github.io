<title>Fabric IQ Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a build board that fills in as you master concepts, with one stage at a time below it. */
:root{
  --bg:#E8ECF4; --panel:#FFFFFF; --ink:#10152B; --muted:#56607C; --line:#10152B; --soft:#DDE4F3;
  --accent:#2B54F0; --on-accent:#FFFFFF; --xp:#E6A700; --ok:#12875A; --ok-bg:#D9F3E7; --bad:#CF3447; --bad-bg:#FBE0E4;
  --warn-bg:#FFF1CC; --shadow:#10152B; --on-zone:#FFFFFF;
  --z1:#7A5AF8; --z2:#087F7A; --z3:#B85F00; --z4:#C23B8B; --z5:#2B54F0; --z6:#1C8F4E;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1121; --panel:#151C33; --ink:#E8ECFB; --muted:#9BA7C8; --line:#3A4670; --soft:#1F2847;
    --accent:#7F9BFF; --on-accent:#0C1121; --xp:#FFC933; --ok:#58D68D; --ok-bg:#12342A; --bad:#FF7B8C; --bad-bg:#3A1A22;
    --warn-bg:#3A2F10; --shadow:#000000; --on-zone:#0C1121;
    --z1:#A28FFF; --z2:#3FD0C9; --z3:#FFAE42; --z4:#FF7DBD; --z5:#86A0FF; --z6:#58D68D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1121; --panel:#151C33; --ink:#E8ECFB; --muted:#9BA7C8; --line:#3A4670; --soft:#1F2847;
  --accent:#7F9BFF; --on-accent:#0C1121; --xp:#FFC933; --ok:#58D68D; --ok-bg:#12342A; --bad:#FF7B8C; --bad-bg:#3A1A22;
  --warn-bg:#3A2F10; --shadow:#000000; --on-zone:#0C1121;
  --z1:#A28FFF; --z2:#3FD0C9; --z3:#FFAE42; --z4:#FF7DBD; --z5:#86A0FF; --z6:#58D68D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font:800 17px var(--f-display)}
.logo{width:22px;height:22px;background:var(--accent);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);transform:rotate(-6deg)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:8px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{box-shadow:none;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.on{background:var(--soft)}
main{padding-block:6px 36px;display:grid;gap:18px;outline:none}
.hud{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 12px;box-shadow:3px 3px 0 var(--shadow);min-width:0}
.stat .lab,.lab{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .val{font:800 18px var(--f-display);margin-top:2px;overflow-wrap:anywhere}
.xpbar{height:8px;background:var(--soft);border:1.5px solid var(--line);margin-top:8px;border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:16px;box-shadow:4px 4px 0 var(--shadow);min-width:0}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sect-h h2{font-size:18px}
.sub{color:var(--muted);font-size:13px}
/* board */
.board{display:grid;gap:8px}
.layer{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:stretch}
.ll{border-left:6px solid var(--zc);padding:4px 0 4px 10px;display:flex;flex-direction:column;justify-content:center}
.ll b{font:800 12px var(--f-mono);color:var(--muted)}
.ll span{font:700 14px var(--f-display)}
.lb{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.block{position:relative;text-align:left;flex:1 1 150px;min-width:0;border:2px solid var(--line);border-radius:6px;padding:9px 11px 12px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.block .bn{font:600 13px/1.25 var(--f-body);overflow-wrap:anywhere}
.block .bm{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.block .bm i{display:block;height:100%;background:var(--zc)}
.block.ghost{border-style:dashed;background:transparent;color:var(--muted)}
.block.wip{border-color:var(--zc)}
.block.built{background:var(--zc);color:var(--on-zone);box-shadow:3px 3px 0 var(--shadow)}
.block.built .bm{background:rgba(255,255,255,.35)}
.block.built .bm i{background:var(--on-zone)}
.block.pop{animation:pop .5s ease-out}
.tg{position:absolute;top:-9px;right:8px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--ink);border:1.5px solid var(--line);padding:1px 6px;border-radius:3px}
@keyframes pop{0%{transform:scale(.8) rotate(-2deg)}60%{transform:scale(1.06)}100%{transform:none}}
.detail{margin-top:12px;border-top:2px dashed var(--line);padding-top:12px;font-size:14px}
.detail b{font-family:var(--f-display);font-size:14px}
/* zone cards */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.zc{background:var(--panel);border:2px solid var(--line);border-top:8px solid var(--zc);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.zc h3{font-size:15px}
.zc.locked{opacity:.6}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{font:500 11px var(--f-mono);border:1.5px solid var(--line);border-radius:3px;padding:1px 6px;background:var(--panel)}
.pip.done{background:var(--zc);color:var(--on-zone);border-color:var(--zc)}
/* stage */
.stagehead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chipc{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--line);padding:3px 8px;border-radius:3px;background:var(--soft)}
.mbar{display:flex;align-items:center;gap:8px;font:500 11px var(--f-mono);color:var(--muted)}
.mbar .track{position:relative;width:120px;height:9px;background:var(--soft);border:1.5px solid var(--line);border-radius:5px;overflow:hidden}
.mbar .track i{display:block;height:100%;background:var(--zc,var(--accent))}
.mbar .track u{position:absolute;left:70%;top:0;bottom:0;width:2px;background:var(--line)}
.banner{background:var(--warn-bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.q{font:600 17px/1.4 var(--f-body);margin:0 0 12px;max-width:68ch;text-wrap:pretty}
pre.code{font:13px/1.5 var(--f-mono);background:var(--soft);padding:12px;overflow-x:auto;border:2px solid var(--line);border-radius:6px;margin:0 0 12px;max-width:100%}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:11px 12px;font:500 15px/1.4 var(--f-body);cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.opt .k{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:5px;display:grid;place-items:center;font:600 12px var(--f-mono);background:var(--soft)}
.opt.out{opacity:.45;text-decoration:line-through;box-shadow:none;cursor:default}
.opt.good{background:var(--ok-bg);border-color:var(--ok)}
.opt:disabled{cursor:default}
.lab{margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:8px;font:500 14px/1.35 var(--f-body);text-align:left;cursor:pointer;box-shadow:2px 2px 0 var(--shadow);max-width:100%}
.chip:disabled{cursor:default;box-shadow:none}
.chip.sel{outline:3px solid var(--accent);outline-offset:1px}
.chip.good{background:var(--ok-bg);border-color:var(--ok)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad)}
.ans{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
.ans li{counter-increment:s;display:flex;gap:8px;align-items:center}
.ans li::before{content:counter(s);flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-mono);background:var(--accent);color:var(--on-accent)}
.ans li.ph{color:var(--muted);font-size:13px}
.ans li.ph::before{content:"";background:transparent;border-style:dashed}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mcols .chip{width:100%}
.pc0{background:var(--z1);color:var(--on-zone);border-color:var(--z1)}
.pc1{background:var(--z2);color:var(--on-zone);border-color:var(--z2)}
.pc2{background:var(--z3);color:var(--on-zone);border-color:var(--z3)}
.pc3{background:var(--z4);color:var(--on-zone);border-color:var(--z4)}
.pc4{background:var(--z5);color:var(--on-zone);border-color:var(--z5)}
.pc5{background:var(--z6);color:var(--on-zone);border-color:var(--z6)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.bucket{border:2px dashed var(--line);border-radius:6px;padding:10px;min-height:96px;background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit}
.bucket h4{margin:0;font:700 13px var(--f-display)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.fb{border:2px solid var(--line);border-radius:6px;padding:12px;margin-top:14px;background:var(--panel)}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.warn{background:var(--warn-bg)}
.gain{font:800 13px var(--f-mono);margin-top:6px}
.coach{font-size:13px;color:var(--muted);margin-top:4px}
.learn h2{font-size:20px;margin-bottom:10px}
.learn p{max-width:66ch;margin:0 0 10px;text-wrap:pretty}
.ex,.mis{border-left:5px solid var(--zc,var(--accent));padding:6px 12px;background:var(--soft);margin:0 0 10px;max-width:66ch}
.mis{border-left-color:var(--bad)}
.ex b,.mis b{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;display:block}
.placed{text-align:center;padding:10px 0}
.placed .block{max-width:320px;margin:12px auto;flex:none;cursor:default}
.codex{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cx{background:var(--panel);border:2px solid var(--line);border-top:8px solid var(--zc);border-radius:6px;padding:12px;font-size:14px;min-width:0}
.cx h3{font-size:14px;margin-bottom:6px}
.cx p{margin:6px 0}
.cx.lockd{opacity:.55;border-top-style:dashed}
.foot{color:var(--muted);font-size:12px;padding-bottom:28px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.search{font:500 15px var(--f-body);border:2px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);color:var(--ink);width:100%;max-width:360px;box-shadow:3px 3px 0 var(--shadow)}
.jt{background:var(--panel);border:2px solid var(--line);border-left:8px solid var(--zc);border-radius:6px;min-width:0}
.jt>button{width:100%;text-align:left;background:transparent;border:0;padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font:700 15px var(--f-body)}
.jt>button span.sub{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;flex:none}
.jb{padding:0 12px 12px;font-size:14px;display:grid;gap:8px}
.jb p{margin:0;max-width:68ch}
.jb .ex,.jb .mis{margin:0}
.jl{display:grid;gap:10px}
.rel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rel .chip{padding:3px 8px;font-size:12px;box-shadow:none}
ol.fl{margin:0;padding-left:20px;display:grid;gap:6px}

.chat{display:grid;gap:10px;max-height:62vh;overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:78ch;border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.msg.ai{background:var(--panel);box-shadow:3px 3px 0 var(--shadow)}
.msg.me{background:var(--soft);justify-self:end}
.msg ul{margin:6px 0 0;padding-left:20px}
.msg code{font:13px var(--f-mono);background:var(--soft);padding:1px 5px;border-radius:3px}
.msg .opts{margin-top:10px}
.tbar{display:flex;gap:8px;margin-top:10px}
.tbar .search{max-width:none;flex:1}
.srcs{margin-top:8px;font-size:12px}.srcs summary{cursor:pointer;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}.src{margin-top:8px;border-left:4px solid var(--accent);padding-left:8px}
.who{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
@media (max-width:720px){
  .hud{grid-template-columns:1fr 1fr}
  .hud .stat:first-child{grid-column:1/-1}
  .layer{grid-template-columns:1fr}
  .ll{flex-direction:row;gap:8px;align-items:baseline}
  .mcols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.block.pop{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo"></span><span>Fabric IQ Quest</span></div>
    <div class="nav">
      <button class="btn" id="nb" type="button">Board</button>
      <button class="btn" id="nt" type="button">Guided course</button>
      <button class="btn" id="nj" type="button">Jargon</button>
      <button class="btn" id="nc" type="button">Codex</button>
      <button class="btn ghost" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">Built from the five Fabric IQ lessons. Status labels follow Microsoft Learn on 2026-11-07 and change often, so check the page before you rely on a preview feature.</footer>
</div>

<script>
/* ===== DATA ===== */
const Q=(c,d,q,o,a,why,x)=>Object.assign({c,d,type:'mcq',q,o,a,why},x||{});
const O=(c,d,q,items,why)=>({c,d,type:'order',q,items,why});
const M=(c,d,q,pairs,why)=>({c,d,type:'match',q,pairs,why});
const T=(c,d,q,buckets,items,why)=>({c,d,type:'sort',q,buckets,items,why});

const C={
 capacity:{z:1,name:'Capacity',block:'Capacity Retail-F64',blurb:'The pool of compute that every Fabric item draws from and bills against.',
  t:'A capacity is the pool of compute you buy for Fabric, measured in capacity units (CU). An F SKU is a capacity size: F2 has 2 CUs and F64 has 64. Every item that runs draws CUs from the pool.',
  ex:'Retail-F64 runs the pipeline, the notebook, the SQL queries and the report refresh for the retail company.',mis:'A capacity is compute, not storage. OneLake storage is billed separately.'},
 workspace:{z:1,name:'Workspace and item',block:'Workspace Store Sales',blurb:'A named container for a team. It sets who can see what, and it holds the items.',
  t:'A workspace is a named container for a team. It uses one capacity and sets access through roles: Admin, Member, Contributor and Viewer. An item is one object inside it, such as a lakehouse, a notebook or a report.',
  ex:"The workspace 'Store Sales' holds SalesLakehouse, the CleanOrders notebook and the Daily Store Sales report.",mis:'A workspace is not a data store. It only organizes items.'},
 onelake:{z:2,name:'OneLake',block:'OneLake',blurb:'One data lake for the whole organization. Every workload reads and writes here.',
  t:'OneLake is the one data lake of an organization (tenant). All Fabric workloads store and read data in OneLake, in the open Delta Parquet format, so tools share one copy instead of making their own.',
  ex:'The orders table and the stock table of the retail company are both in OneLake.',mis:'There is one OneLake per tenant. Workspaces are folders inside it, not separate lakes.'},
 lakehouse:{z:2,name:'Lakehouse',block:'Lakehouse SalesLakehouse',blurb:'An item that stores files and Delta tables in OneLake.',
  t:'A lakehouse is an item that stores files and tables in OneLake. The tables use the Delta format, so you can query them with SQL. Fabric adds a read-only SQL analytics endpoint to it.',
  ex:'SalesLakehouse holds the tables orders, products, stores and customers.',mis:'A lakehouse is built for analytics, not as the database of a live application.'},
 ingest:{z:2,name:'Pipeline and notebook',block:'Pipeline + notebook',blurb:'Data Factory moves data in. A Spark notebook cleans it and writes Delta tables.',
  t:'A Data Factory pipeline copies data from sources, such as the point-of-sale database, into the lakehouse. A Data Engineering notebook uses Spark to clean it and to write Delta tables. The result is one copy in OneLake.',
  ex:'At 01:00 a pipeline copies yesterday\'s orders. At 01:30 a notebook removes cancelled orders and writes the tables.',mis:'A pipeline moves data. It does not give the data business meaning.'},
 shortcut:{z:2,name:'Shortcut',block:'Shortcut to orders',blurb:'A pointer to data in another place. Nothing is copied.',
  t:'A OneLake shortcut points to data in another location, such as another workspace, ADLS or Amazon S3. The data stays where it is and Fabric makes no copy.',
  ex:'The Finance workspace adds a shortcut to the orders table instead of copying it.',mis:'A shortcut is not a copy. If the target is deleted or moved, the shortcut stops working.'},
 endpoint:{z:3,name:'SQL analytics endpoint',block:'SQL analytics endpoint',blurb:'Read-only T-SQL on the same Delta tables.',
  t:'Every lakehouse gets a SQL analytics endpoint. It is a read-only T-SQL interface on the same Delta tables, so analysts run SELECT queries with no copy.',
  ex:'The finance team runs a T-SQL query for the monthly margin of each store.',mis:'You cannot INSERT, UPDATE or DELETE through the endpoint. Use Spark or a pipeline.'},
 semantic:{z:3,name:'Semantic model',block:'Semantic model Net Sales',blurb:'Relationships and measures, so every report shows the same number.',
  t:'A Power BI semantic model sits on the lakehouse tables. It adds relationships and measures written in DAX. Every report and tool calls the same measure, so everyone gets the same number.',
  ex:'[Net Sales] = SUM(amount) - SUM(refund_amount). Sales and finance both use it and both show 1,180,000.',mis:'A semantic model is not a report. The report shows data. The model supplies it.'},
 gap:{z:3,name:'The semantic gap',block:'Known-answer test',blurb:'A trusted report number that you compare every agent answer against.',
  t:'Raw tables have technical names and hidden rules. An AI agent can write SQL that runs without error and still gives a wrong business answer. That is the semantic gap. Test agents against a number you trust.',
  ex:"In table ord_hdr, sts = 'X' means cancelled and ref_amt is a refund. An agent that guesses gets 3100 for store CH01. The correct net sales is 2000.",mis:'No SQL error does not mean the answer is right.'},
 realtime:{z:4,name:'Real-Time Intelligence',block:'Eventstream + Activator',blurb:'Data in motion: events in, alerts out.',
  t:'Real-Time Intelligence handles data in motion. An eventstream receives events, such as stock levels from stores. An eventhouse stores them. An Activator rule can send an alert when a condition is true.',
  ex:'When the stock of a product at a store falls below 10 units, Activator sends a Teams message to the store manager.',mis:'Alerts like this come from Real-Time Intelligence, not from a Power BI report.'},
 saas:{z:4,name:'SaaS and your job',block:'Admin and roles',blurb:'Microsoft runs the engines. You still size, secure and watch.',
  t:'Fabric is software as a service. Microsoft runs the servers, the engines and the updates. You still choose and size the capacity, set tenant settings and access, own the data and its business logic, and watch the cost.',
  ex:'Microsoft updates Spark. You decide whether Retail-F64 is big enough and who can use Copilot.',mis:'SaaS does not mean no administration.'},
 costs:{z:4,name:'Cost and limits',block:'Capacity Metrics',blurb:'One shared pool means one bill, and shared contention.',
  t:'All workloads share one capacity, so one large job can throttle every workspace on it. OneLake storage is billed separately, also when the capacity is paused. Delta files are open, but pipelines, models and reports are Fabric objects that you must rebuild elsewhere.',
  ex:'A finance notebook throttles Retail-F64 and store managers cannot open Daily Store Sales.',mis:'Open data files do not remove all vendor lock-in.'},
 ontology:{z:5,name:'Ontology',block:'Ontology RetailOntology',tag:'preview',blurb:'Business concepts, relationships and rules in business words. It points to data and does not copy it.',
  t:'An ontology is a Fabric IQ item. It defines business concepts: entity types such as Store and Order, their properties, how they relate, and rules. It points to live data and does not store a copy.',
  ex:'RetailOntology defines Customer, Order, Product and Store, and how they connect.',mis:'An ontology does not replace the lakehouse or the semantic model. It sits on top of them.'},
 binding:{z:5,name:'Binding',block:'Bindings',tag:'preview',blurb:'The link from each business concept to a table and column.',
  t:'A binding connects an ontology part to source data. It says which table and column supply an entity type, a property or a relationship. The data stays in its source.',
  ex:'Store.Code binds to ord_hdr.st_cd. Order.Status binds to ord_hdr.sts.',mis:'A binding points to data. It does not copy it.'},
 rules:{z:5,name:'Rules',block:'Rules',tag:'preview',blurb:'Natural-language business logic that agents read as context.',
  t:'A rule is business logic written in natural language and linked to ontology concepts, such as how net sales is calculated. Agents read it as context. Microsoft Learn says the new ontology experience does not run rules or start actions, and has no direct Activator integration (checked 2026-11-07).',

/* ===== ENGINE ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='fiq-quest-v1';
const RANKS=[[0,'Trainee'],[50,'Data Intern'],[130,'Pipeline Builder'],[230,'Lakehouse Engineer'],[340,'Fabric Architect'],[440,'IQ Architect']];
const TIER=['Scout','Builder','Architect'];
let S={xp:0,streak:0,best:0,m:{},seen:{},done:{},miss:{}};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')S=Object.assign(S,o)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const mast=id=>S.m[id]||0;
const ids=Object.keys(C);
const zoneOf=id=>C[id].z;
let intro=true;try{intro=localStorage.getItem('fiq-intro')!=='0'}catch(e){}
let view='board',sess=null,ui=null,picked=null;

function rank(){let i=0;RANKS.forEach((r,k)=>{if(S.xp>=r[0])i=k});const nx=RANKS[i+1];return{name:RANKS[i][1],next:nx?nx[0]:null,base:RANKS[i][0]}}
function weakList(excl){return ids.filter(k=>S.done[k]&&k!==excl&&mast(k)<.6).sort((a,b)=>mast(a)-mast(b))}
function unlocked(zn){return zn===1||ZONES[zn-2].concepts.every(c=>S.done[c])}
function tierOf(id){const m=mast(id);return m<.35?0:m<.65?1:2}
function pick(id,td){
  const target=td||tierOf(id)+1;
  let pool=CH.filter(c=>c.c===id);
  const fresh=pool.filter(c=>!sess.corr.has(c));
  if(fresh.length)pool=fresh;
  pool=shuffle(pool).sort((a,b)=>Math.abs(a.d-target)-Math.abs(b.d-target));
  return pool[0];
}
function hud(){
  const r=rank();const built=ids.filter(k=>S.done[k]).length;
  const pct=r.next?Math.min(100,Math.round((S.xp-r.base)/(r.next-r.base)*100)):100;
  return `<div class="hud"><div class="stat"><div class="lab">Rank</div><div class="val">${esc(r.name)}</div><div class="xpbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
  <div class="stat"><div class="lab">XP</div><div class="val">${S.xp}</div></div>
  <div class="stat"><div class="lab">Streak</div><div class="val">${S.streak}</div></div>
  <div class="stat"><div class="lab">Blocks</div><div class="val">${built}/${ids.length}</div></div></div>`;
}
function setApp(h){const a=$('#app');a.innerHTML=hud()+h;try{a.focus({preventScroll:true})}catch(e){}}
function statusText(tag){return tag==='preview'?'Preview on Microsoft Learn (checked 2026-11-07). Use the trial path and keep a GA fallback.':tag==='mixed'?'Status differs by source or by function (checked 2026-11-07). Check Microsoft Learn before you rely on it.':''}

/* ----- board ----- */
function renderBoard(){
  view='board';sess=null;
  const layers=ZONES.slice().reverse().map(z=>{
    const blocks=z.concepts.map(id=>{
      const c=C[id],m=mast(id),st=S.done[id]?'built':(S.seen[id]?'wip':'ghost');
      return `<button type="button" class="block ${st}${picked===id?' sel':''}" data-block="${id}" style="--zc:var(--z${z.n})">${c.tag?`<span class="tg">${c.tag}</span>`:''}<span class="bn">${esc(c.block)}</span><span class="bm"><i style="width:${Math.round(m*100)}%"></i></span></button>`}).join('');
    return `<div class="layer" style="--zc:var(--z${z.n})"><div class="ll"><b>ZONE ${z.n}</b><span>${esc(z.name)}</span></div><div class="lb">${blocks}</div></div>`}).join('');
  const weak=ids.filter(k=>S.done[k]&&mast(k)<.75);
  const zones=ZONES.map(z=>{
    const open=unlocked(z.n),dn=z.concepts.filter(c=>S.done[c]).length,all=dn===z.concepts.length;
    const pips=z.concepts.map(c=>`<span class="pip ${S.done[c]?'done':''}">${esc(C[c].name)}</span>`).join('');
    const label=!open?'Locked':all?'Review zone':dn||z.concepts.some(c=>S.seen[c])?'Continue':'Start';
    return `<div class="zc ${open?'':'locked'}" style="--zc:var(--z${z.n})"><div class="lab">Zone ${z.n}</div><h3>${esc(z.name)}</h3><div class="sub">${esc(z.sub)}</div><div class="pips">${pips}</div><div class="row" style="margin-top:4px"><button type="button" class="btn ${open&&!all?'primary':''}" data-zone="${z.n}" ${open?'':'disabled'}>${label}</button></div></div>`}).join('');
  setApp(`${intro?`<section class="panel"><div class="sect-h"><h2>How to play</h2><button type="button" class="btn" id="hideintro">Got it</button></div>
  <ol class="fl"><li><b>Start with Zone 1.</b> You are building a retail company's data platform (40 stores, an online shop) one block at a time.</li>
  <li><b>Read a short card, then press Build it.</b> Answer questions: pick, order, match or sort. You get one retry.</li>
  <li><b>Mastery decides what happens.</b> Right answers make questions harder. Wrong answers make them easier and bring the concept back for review. At 70% the block appears on the board.</li>
  <li><b>Already know a topic?</b> Press "I know this. Test me." to skip it with one correct answer.</li>
  <li><b>Stuck on a word?</b> Open Jargon any time. Codex keeps the cards you have read.</li>
  <li><b>Preview tags</b> mark parts of Fabric IQ that are still preview. Check Microsoft Learn before using them in production.</li></ol></section>`:''}<section class="panel"><div class="sect-h"><h2>Your retail data platform</h2><div class="row" style="margin:0"><button type="button" class="btn" id="rev" ${weak.length?'':'disabled'}>Review weak spots${weak.length?` (${weak.length})`:''}</button></div></div>
  <div class="sub" style="margin-bottom:12px">Each block appears when you master its concept. Tap a block to read about it. A thin bar shows your mastery. Missed answers return for review, and right answers make the questions harder.</div>
  <div class="board">${layers}</div><div class="detail" id="detail">Tap a block to see what it does and where you stand.</div></section>
  <section><div class="sect-h"><h2>Zones</h2><span class="sub">Finish a zone to unlock the next one.</span></div><div class="zones">${zones}</div></section>`);
}
function showBlock(id){
  picked=id;const c=C[id],m=Math.round(mast(id)*100);
  const st=S.done[id]?'Built':S.seen[id]?'In progress':'Not started';
  const note=statusText(c.tag);
  $('#detail').innerHTML=`<b>${esc(c.block)}</b> <span class="sub">Zone ${c.z}, ${esc(c.name)}. ${st}, mastery ${m}%.</span><div style="margin-top:6px">${esc(c.blurb)}</div>${note?`<div class="sub" style="margin-top:6px">${esc(note)}</div>`:''}`;
  document.querySelectorAll('.block').forEach(b=>b.classList.toggle('sel',b.dataset.block===id));
}

/* ----- sessions ----- */
function startZone(n){
  const z=ZONES[n-1];
  if(z.concepts.every(c=>S.done[c]))return startReview(z.concepts,5);
  sess={type:'zone',z,i:0,cid:null,corr:new Set(),cnt:{}};view='stage';nextConcept(true);
}
function startReview(list,max){
  sess={type:'review',ids:list,n:0,max:max,corr:new Set(),cnt:{}};view='stage';reviewNext();
}
function reviewNext(){
  if(sess.n>=sess.max)return reviewDone();
  const id=sess.ids.slice().sort((a,b)=>mast(a)-mast(b))[0];
  ask(id,'rv');
}
function reviewDone(){
  const rows=sess.ids.map(id=>`<div class="mbar" style="--zc:var(--z${zoneOf(id)});margin:6px 0"><span style="min-width:170px;color:var(--ink)">${esc(C[id].name)}</span><span class="track"><i style="width:${Math.round(mast(id)*100)}%"></i><u></u></span><span>${Math.round(mast(id)*100)}%</span></div>`).join('');
  setApp(`<section class="panel placed"><h2>Review complete</h2><p class="sub">Your mastery after this round. The line marks the 70% goal.</p><div style="max-width:420px;margin:12px auto;text-align:left">${rows}</div><button type="button" class="btn primary" id="home">Back to the board</button></section>`);
}
function nextConcept(first){
  const z=sess.z;
  while(sess.i<z.concepts.length&&S.done[z.concepts[sess.i]])sess.i++;
  if(sess.i>=z.concepts.length)return zoneDone();
  sess.cid=z.concepts[sess.i];sess.cnt[sess.cid]=0;
  const w=first?[]:weakList(sess.cid);
  if(w.length)ask(w[0],'review');else enterConcept();
}
function enterConcept(){const id=sess.cid;if(mast(id)>=.7)place(id);else showLearn(id,false)}
function showLearn(id,afterProbe){
  S.seen[id]=true;save();const c=C[id];
  setApp(`<section class="panel learn" style="--zc:var(--z${c.z})"><div class="stagehead"><span class="chipc">Zone ${c.z} · ${esc(ZONES[c.z-1].name)}</span><span class="chipc">Learn</span></div>
  <h2>${esc(c.name)}</h2>${afterProbe?'<div class="banner">That test-out did not go through. Read this card, then build it.</div>':''}
  <p>${esc(c.t)}</p><div class="ex"><b>Retail example</b>${esc(c.ex)}</div><div class="mis"><b>Common mistake</b>${esc(c.mis)}</div>
  <div class="row"><button type="button" class="btn primary" id="build">Build it</button>${afterProbe?'':'<button type="button" class="btn" id="know">I know this. Test me.</button>'}</div></section>`);
}
function place(id){
  const c=C[id];const first=!S.done[id];S.done[id]=true;S.seen[id]=true;save();
  const last=sess.z&&sess.i>=sess.z.concepts.length-1;
  setApp(`<section class="panel placed"><div class="lab">Block placed</div><h2>${esc(c.block)}</h2>
  <div class="block built pop" style="--zc:var(--z${c.z})">${c.tag?`<span class="tg">${c.tag}</span>`:''}<span class="bn">${esc(c.block)}</span><span class="bm"><i style="width:${Math.round(mast(id)*100)}%"></i></span></div>
  <p class="sub" style="max-width:52ch;margin:0 auto 6px">${esc(c.blurb)}</p>${statusText(c.tag)?`<p class="sub" style="max-width:52ch;margin:0 auto 6px">${esc(statusText(c.tag))}</p>`:''}
  <div class="row" style="justify-content:center"><button type="button" class="btn primary" id="after">${last?'Finish zone':'Next concept'}</button></div></section>`);
}
function zoneDone(){
  const z=sess.z;
  setApp(`<section class="panel placed" style="--zc:var(--z${z.n})"><div class="lab">Zone ${z.n} complete</div><h2>${esc(z.name)}</h2><p class="sub">${z.concepts.length} blocks are now part of your platform.${z.n<6?' The next zone is open.':' The whole platform is built.'}</p>
  <div class="pips" style="justify-content:center;margin:10px 0">${z.concepts.map(c=>`<span class="pip done">${esc(C[c].name)}</span>`).join('')}</div>
  <button type="button" class="btn primary" id="home">Back to the board</button></section>`);
}

/* ----- asking ----- */
function ask(id,kind){
  const ch=pick(id,kind==='probe'?2:null);
  sess.cur={ch,id,attempt:1,kind,ok1:false};drawChallenge();
}
function drawChallenge(){
  const cur=sess.cur,ch=cur.ch,id=cur.id,c=C[id],m=mast(id);
  const banner={review:'Quick review from an earlier zone. This keeps old blocks solid.',probe:'Test-out: answer correctly on the first try to skip this concept.',rv:`Review round ${sess.n+1} of ${sess.max}.`}[cur.kind];
  setApp(`<section class="panel" style="--zc:var(--z${c.z})"><div class="stagehead"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chipc">${esc(c.name)}</span><span class="chipc">${TIER[Math.min(2,ch.d-1)]} question</span></div>
  <div class="mbar"><span>Mastery</span><span class="track"><i style="width:${Math.round(m*100)}%"></i><u></u></span><span>${Math.round(m*100)}%</span></div></div>
  ${banner?`<div class="banner">${esc(banner)}</div>`:''}<p class="q">${esc(ch.q)}</p>${ch.code?`<pre class="code">${esc(ch.code)}</pre>`:''}
  <div id="box"></div><div id="fb" aria-live="polite"></div></section>`);
  const box=$('#box');
  ui=ch.type==='mcq'?uiMcq(ch,box):ch.type==='order'?uiOrder(ch,box):ch.type==='match'?uiMatch(ch,box):uiSort(ch,box);
}
function handle(ok){
  const cur=sess.cur;
  if(ok)return finish(true);
  if(cur.attempt===1){cur.attempt=2;$('#fb').innerHTML=`<div class="fb warn"><b>Not yet.</b> ${esc(ui.hint())} You get one more try.</div>`;ui.retry();}
  else{ui.reveal();finish(false)}
}
function finish(ok){
  const cur=sess.cur,id=cur.id,a=cur.attempt;let gain=0;const m=mast(id);
  if(ok){
    if(a===1){S.m[id]=m+(1-m)*.5;gain=12+Math.min(S.streak,5)*2;S.streak++;}
    else{S.m[id]=m+(1-m)*.25;gain=6;S.streak=0;}
    sess.corr.add(cur.ch);
  }else{S.m[id]=m*.55;S.streak=0;S.miss[id]=(S.miss[id]||0)+1;gain=1;}
  if(cur.kind==='probe'&&ok&&a===1)S.m[id]=Math.max(S.m[id],.8);
  cur.ok1=ok&&a===1;
  if(cur.kind==='' )sess.cnt[id]=(sess.cnt[id]||0)+1;
  S.xp+=gain;S.best=Math.max(S.best||0,S.streak);save();
  ui.lock();
  const pct=Math.round(mast(id)*100);
  let coach='';
  if(!ok)coach=`${C[id].name} dropped to ${pct}%. Expect an easier question next, and a quick review later.`;
  else if(S.streak>=3)coach=`Streak of ${S.streak}. Questions on ${C[id].name} get harder as your mastery rises.`;
  else if(a===2)coach=`Correct, but not on the first try. ${C[id].name} is at ${pct}%.`;
  else coach=`${C[id].name} is at ${pct}%. You need 70% to place the block.`;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?(a===1?'Correct.':'Correct on the second try.'):'Not this time.'}</b> ${esc(cur.ch.why)}<div class="gain">+${gain} XP</div><div class="coach">${esc(coach)}</div></div><div class="row"><button type="button" class="btn primary" id="next">Continue</button></div>`;lastAsk=`In the game I was asked: "${cur.ch.q}" I got it ${ok?(a===1?'right':'right on the second try'):'wrong'}. The game said: ${cur.ch.why} Explain it again in a different way, with a small code or before/after example, then ask me one new question.`;
  const nb=$('#next');if(nb)nb.focus({preventScroll:true});
}
function advance(){
  const cur=sess.cur;
  if(sess.type==='review'){sess.n++;return reviewNext()}
  if(cur.kind==='review')return enterConcept();
  if(cur.kind==='probe'){if(cur.ok1)return place(cur.id);return showLearn(cur.id,true)}
  if(mast(cur.id)>=.7||(sess.cnt[cur.id]||0)>=6)return place(cur.id);
  ask(cur.id,'');
}

/* ----- interactions ----- */
function uiMcq(ch,box){
  const order=shuffle(ch.o.map((_,i)=>i));let locked=false;
  box.innerHTML=`<div class="opts">${order.map((i,n)=>`<button type="button" class="opt" data-i="${i}"><span class="k">${'ABCDEF'[n]}</span><span>${esc(ch.o[i])}</span></button>`).join('')}</div>`;
  let last=null;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked||b.classList.contains('out'))return;last=b;handle(+b.dataset.i===ch.a)});
  return{hint:()=>{if(last)last.classList.add('out');return 'That option is out.'},retry:()=>{},
    reveal:()=>{box.querySelectorAll('.opt').forEach(b=>{if(+b.dataset.i===ch.a)b.classList.add('good')})},
    lock:()=>{locked=true;box.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===ch.a)b.classList.add('good')})}};
}
function uiOrder(ch,box){
  let pool=shuffle(ch.items.map((_,i)=>i)),ans=[],locked=false,mark=null;
  const draw=()=>{
    box.innerHTML=`<div class="lab">Your build order</div><ol class="ans">${ans.length?ans.map((i,k)=>`<li><button type="button" class="chip ${mark?(mark[k]?'good':'bad'):''}" data-r="${i}" ${locked?'disabled':''}>${esc(ch.items[i])}</button></li>`).join(''):'<li class="ph">Tap the steps below in order</li>'}</ol>
    <div class="lab">Available steps</div><div class="chips">${pool.map(i=>`<button type="button" class="chip" data-a="${i}" ${locked?'disabled':''}>${esc(ch.items[i])}</button>`).join('')}</div>
    <div class="row"><button type="button" class="btn primary" id="chk" ${pool.length||locked?'disabled':''}>Check order</button><button type="button" class="btn ghost" id="rst" ${locked?'disabled':''}>Reset</button></div>`;
    box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.dataset.a;pool=pool.filter(x=>x!==i);ans.push(i);mark=null;draw()});
    box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const i=+b.dataset.r;ans=ans.filter(x=>x!==i);pool.push(i);mark=null;draw()});
    const r=box.querySelector('#rst');if(r)r.onclick=()=>{pool=shuffle(ch.items.map((_,i)=>i));ans=[];mark=null;draw()};
    const k=box.querySelector('#chk');if(k)k.onclick=()=>handle(ans.every((v,n)=>v===n));
  };
  draw();
  return{hint:()=>{const n=ans.filter((v,k)=>v===k).length;return `${n} of ${ans.length} steps are in the right place.`},retry:()=>{},
    reveal:()=>{ans=ch.items.map((_,i)=>i);pool=[];mark=ans.map(()=>true);locked=true;draw()},lock:()=>{locked=true;mark=ans.map((v,k)=>v===k);draw()}};
}
function uiMatch(ch,box){
  const n=ch.pairs.length;let rights=shuffle(ch.pairs.map((_,i)=>i)),pair={},sel=null,locked=false,mark=null;
  const used=j=>Object.keys(pair).find(k=>pair[k]===j);
  const draw=()=>{
    box.innerHTML=`<div class="lab">Tap a left item, then its match on the right. Tap a matched item to undo.</div><div class="mcols"><div class="chips" style="flex-direction:column;align-items:stretch">${ch.pairs.map((p,i)=>`<button type="button" class="chip ${pair[i]!==undefined?'pc'+(i%6):''} ${sel===i?'sel':''} ${mark?(mark[i]?'good':'bad'):''}" data-l="${i}" ${locked?'disabled':''}>${esc(p[0])}</button>`).join('')}</div>
    <div class="chips" style="flex-direction:column;align-items:stretch">${rights.map(j=>{const k=used(j);return `<button type="button" class="chip ${k!==undefined?'pc'+(k%6):''}" data-rt="${j}" ${locked?'disabled':''}>${esc(ch.pairs[j][1])}</button>`}).join('')}</div></div>
    <div class="row"><button type="button" class="btn primary" id="chk" ${Object.keys(pair).length<n||locked?'disabled':''}>Check matches</button></div>`;
    box.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const i=+b.dataset.l;mark=null;if(pair[i]!==undefined){delete pair[i];sel=null}else sel=sel===i?null:i;draw()});
    box.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{const j=+b.dataset.rt;mark=null;const k=used(j);if(k!==undefined){delete pair[k];draw();return}if(sel!==null){pair[sel]=j;sel=null}draw()});
    const k=box.querySelector('#chk');if(k)k.onclick=()=>handle(ch.pairs.every((_,i)=>pair[i]===i));
  };
  draw();
  return{hint:()=>{const g=ch.pairs.filter((_,i)=>pair[i]===i).length;return `${g} of ${n} matches are right.`},retry:()=>{},
    reveal:()=>{pair={};ch.pairs.forEach((_,i)=>pair[i]=i);mark=ch.pairs.map(()=>true);locked=true;draw()},
    lock:()=>{locked=true;mark=ch.pairs.map((_,i)=>pair[i]===i);draw()}};
}
function uiSort(ch,box){
  const items=ch.items;let asg={},sel=null,locked=false,mark=null;
  const draw=()=>{
    const free=items.map((_,i)=>i).filter(i=>asg[i]===undefined);
    box.innerHTML=`<div class="lab">Tap an item, then tap the group it belongs to. Tap a placed item to take it back.</div><div class="chips">${free.map(i=>`<button type="button" class="chip ${sel===i?'sel':''}" data-it="${i}" ${locked?'disabled':''}>${esc(items[i][0])}</button>`).join('')||'<span class="sub">All items are placed.</span>'}</div>
    <div class="buckets">${ch.buckets.map((b,bi)=>`<div class="bucket" data-b="${bi}" role="button" tabindex="0"><h4>${esc(b)}</h4>${items.map((it,i)=>asg[i]===bi?`<button type="button" class="chip ${mark?(mark[i]?'good':'bad'):''}" data-pl="${i}" ${locked?'disabled':''}>${esc(it[0])}</button>`:'').join('')}</div>`).join('')}</div>
    <div class="row"><button type="button" class="btn primary" id="chk" ${free.length||locked?'disabled':''}>Check groups</button></div>`;
    box.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{const i=+b.dataset.it;sel=sel===i?null:i;draw()});
    box.querySelectorAll('[data-pl]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(locked)return;delete asg[+b.dataset.pl];mark=null;draw()});
    box.querySelectorAll('.bucket').forEach(b=>{const go=()=>{if(locked||sel===null)return;asg[sel]=+b.dataset.b;sel=null;mark=null;draw()};b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
    const k=box.querySelector('#chk');if(k)k.onclick=()=>handle(items.every((it,i)=>asg[i]===it[1]));
  };
  draw();
  return{hint:()=>{const g=items.filter((it,i)=>asg[i]===it[1]).length;return `${g} of ${items.length} items are in the right group.`},retry:()=>{},
    reveal:()=>{items.forEach((it,i)=>asg[i]=it[1]);mark=items.map(()=>true);locked=true;draw()},
    lock:()=>{locked=true;mark=items.map((it,i)=>asg[i]===it[1]);draw()}};
}

/* ----- codex ----- */
function renderCodex(){
  view='codex';sess=null;
  const cards=ids.map(id=>{
    const c=C[id],seen=S.seen[id];
    if(!seen)return `<div class="cx lockd" style="--zc:var(--z${c.z})"><div class="lab">Zone ${c.z}</div><h3>Locked entry</h3><p class="sub">Open this concept in a zone to unlock it.</p></div>`;
    return `<div class="cx" style="--zc:var(--z${c.z})"><div class="lab">Zone ${c.z}${c.tag?' · '+c.tag:''}</div><h3>${esc(c.name)}</h3><div class="mbar" style="margin-bottom:6px"><span class="track"><i style="width:${Math.round(mast(id)*100)}%"></i><u></u></span><span>${Math.round(mast(id)*100)}%</span></div><p>${esc(c.t)}</p><p class="sub"><b>Example:</b> ${esc(c.ex)}</p><p class="sub"><b>Avoid:</b> ${esc(c.mis)}</p></div>`}).join('');
  setApp(`<section><div class="sect-h"><h2>Codex</h2><span class="sub">Every concept you open is saved here for revision.</span></div><div class="codex">${cards}</div></section>
  <section class="panel"><div class="sect-h"><h2>Progress</h2></div><div class="sub">Best streak: ${S.best||0}. Progress is saved in this browser only.</div><div class="row"><button type="button" class="btn" id="reset">Reset progress</button></div></section>`);
}

es' for the sales analytics team.", "programmer_analogy": "It is like a project folder or a Git repository that a team shares.", "why_it_matters": "You must create each data object and each report inside a workspace.", "related_terms": [2, 7], "common_mistake": "Do not think that a workspace is a type of data store. It only holds and organizes objects."}, {"id": 7, "term": "item", "category": "platform", "definition": "An item is one object that you create in a workspace. Each workload supplies its item types. Examples are a notebook and a report. Many of the next terms are also item types.", "simple_example": "The 'Store Sales' workspace contains a notebook item and a report item.", "programmer_analogy": "It is like one file in a project folder, where the file type sets which tool opens it.", "why_it_matters": "Most components in this lesson are items.", "related_terms": [5, 6], "common_mistake": "Do not think that all items store data. Some items only contain logic or settings."}, {"id": 8, "term": "OneLake", "category": "data", "definition": "OneLake is the one data lake that all of Microsoft Fabric uses. Each organization has one OneLake. All workloads read and write data in OneLake, so they do not need to copy the data.", "simple_example": "The sales tables and the stock tables of the retail company are both in OneLake.", "programmer_analogy": "It is like one shared object store, for example one S3 bucket, that all services in the company mount.", "why_it_matters": "All Fabric data that the next terms use is in OneLake.", "related_terms": [1, 9, 12], "common_mistake": "Do not think that each workspace has a different OneLake. There is one OneLake for each organization, and workspaces are folders inside it."}, {"id": 9, "term": "lakehouse", "category": "data", "definition": "A lakehouse is an item that stores files and tables in OneLake. It keeps its tables in the open Delta Lake format. You can query its tables with Structured Query Language (SQL).", "simple_example": "A lakehouse holds the tables 'Orders', 'Products', and 'Stores' for the retail company.", "programmer_analogy": "It is like a data lake folder of Parquet files that you can also query like a SQL database.", "why_it_matters": "A lakehouse table is a usual source of data for reports and for AI agents.", "related_terms": [7, 8, 18], "common_mistake": "Do not think that a lakehouse is a transactional database for an application. It is for analytics."}, {"id": 10, "term": "Power BI semantic model", "category": "semantics", "definition": "A Power BI semantic model is an item that prepares data for reports. It contains tables, relationships between tables, and measures. A measure is a calculation that you write in Data Analysis Expressions (DAX).", "simple_example": "A semantic model has the measure 'Total Sales = SUM(Orders[Amount])' that all sales reports use.", "programmer_analogy": "It is like a database view layer with stored, named calculations that all clients call.", "why_it_matters": "The semantic model gives the same numbers to all reports and to AI agents.", "related_terms": [7, 12, 20, 21], "common_mistake": "Do not think that a semantic model is a report. A report shows data, and the semantic model supplies the data to the report."}, {"id": 11, "term": "preview vs GA (general availability)", "category": "process", "definition": "A preview function is available for tests, but Microsoft does not give a service-level agreement (SLA) for it. Microsoft can change it. A general availability (GA) function is complete, supported, and safe for production.", "simple_example": "The retail team tests a new preview function, but uses only GA functions for the main sales reports.", "programmer_analogy": "It is like a beta release versus a stable release of a library.", "why_it_matters": "Many new Microsoft Fabric components are in preview, so you must examine the status before you use them in production.", "related_terms": [12, 13], "common_mistake": "Do not think that a preview function stays the same. Its screens, APIs, and limits can change."}, {"id": 12, "term": "Fabric IQ", "category": "semantics", "definition": "Fabric IQ is a workload in Microsoft Fabric that gives business meaning to data. It helps people and AI agents to understand data in business words. It has three layers: data in OneLake, Power BI semantic models, and a layer of business concepts. The next term, ontology, is that third layer.", "simple_example": "With Fabric IQ, an agent understands that the column 'cust_id' in a table means 'Customer'.", "programmer_analogy": "It is like a shared domain model in Domain-Driven Design (DDD) that all services and AI agents read.", "why_it_matters": "Without business meaning, an AI agent can read data but can misunderstand it.", "related_terms": [5, 8, 10, 13, 19, 20, 21, 22], "common_mistake": "Do not think that Fabric IQ is one item or one AI model. It is a workload with many items."}, {"id": 13, "term": "ontology", "category": "semantics", "definition": "An ontology is a Fabric IQ item that defines the business concepts of an organization and how they connect. A computer can read this definition. The ontology connects to live data, so the data stays in its source system.", "simple_example": "A retail ontology defines Customer, Order, Product, and Store, and how each one connects to the others.", "programmer_analogy": "It is like a typed schema or an Entity-Relationship (ER) diagram that also points to the real tables.", "why_it_matters": "The ontology is the main vocabulary that agents use to understand business data.", "related_terms": [12, 14, 15, 16, 17, 18, 19], "common_mistake": "Do not think that an ontology stores a copy of the data. It defines meaning and points to the data."}, {"id": 14, "term": "entity type", "category": "semantics", "definition": "An entity type is the definition of one business concept in an ontology. Examples are Customer, Product, and Store. An entity type does not depend on one source table.", "simple_example": "The entity type 'Store' represents all stores of the retail company.", "programmer_analogy": "It is like a class definition in object-oriented programming.", "why_it_matters": "Entity types are the nouns that people and agents use when they ask questions about data.", "related_terms": [13, 15, 16, 17], "common_mistake": "Do not think that one entity type must match one table. One entity type can get data from many tables."}, {"id": 15, "term": "property", "category": "semantics", "definition": "A property is a named characteristic of an entity type. Each property has a data type. A property can get its values from fields in one or more data sources.", "simple_example": "The entity type 'Product' has the properties 'Name', 'Price', and 'Category'.", "programmer_analogy": "It is like a typed field or attribute in a class.", "why_it_matters": "Properties give the specific values that answers and calculations use.", "related_terms": [14, 18], "common_mistake": "Do not give a property the name of a source column, for example 'prd_nm'. Use a business name, for example 'Name'."}, {"id": 16, "term": "entity instance", "category": "semantics", "definition": "An entity instance is one real occurrence of an entity type that comes from data. Fabric IQ finds instances in the source data.", "simple_example": "The store 'Chennai Main Road' is an instance of the entity type 'Store'.", "programmer_analogy": "It is like an object that you create from a class.", "why_it_matters": "Questions from people and agents are usually about specific instances, not about the entity type.", "related_terms": [14, 18], "common_mistake": "Do not mix the entity type 'Store' with one specific store. The entity type is the definition, and the instance is one store."}, {"id": 17, "term": "relationship", "category": "semantics", "definition": "A relationship defines how two entity types connect. It has a business name, for example 'Customer places Order'. You can use a relationship again in many questions.", "simple_example": "The relationship 'Order contains Product' connects the entity type 'Order' to the entity type 'Product'.", "programmer_analogy": "It is like a foreign key, but with a business name and a direction.", "why_it_matters": "Relationships let an agent follow connections, for example from a store to its orders to its products.", "related_terms": [14, 19], "common_mistake": "Do not think that an ontology relationship is the same as a Power BI semantic model relationship. They are in different items and have different purposes."}, {"id": 18, "term": "binding (data binding)", "category": "data", "definition": "A binding connects a part of an ontology to source data. It tells Fabric IQ which table and which columns supply the values of an entity type, a property, or a relationship. The data stays in its source.", "simple_example": "A binding connects the property 'Product.Price' to the column 'unit_price' in the lakehouse table 'Products'.", "programmer_analogy": "It is like an Object-Relational Mapping (ORM) annotation that maps a class field to a database column.", "why_it_matters": "Without bindings, an ontology has definitions but no real data.", "related_terms": [9, 13, 14, 15, 16], "common_mistake": "Do not think that a binding copies data into the ontology. It only points to the data."}, {"id": 19, "term": "rule", "category": "semantics", "definition": "A rule is business logic that you write in natural language and connect to ontology concepts. It gives agents more context about how the business operates.", "simple_example": "A rule says: 'A product is low in stock when the store has fewer than 10 units.'", "programmer_analogy": "It is like a business-logic comment that a program can read, attached to a class.", "why_it_matters": "Rules help agents to give answers that agree with company policy.", "related_terms": [13, 14, 23], "common_mistake": "Do not think that an ontology rule blocks bad data like a database constraint. Microsoft Learn describes a rule as context, not as enforcement."}, {"id": 20, "term": "Graph", "category": "data", "definition": "Graph in Microsoft Fabric stores data as nodes and edges. It finds connections across many steps. You query it with Graph Query Language (GQL), and it reads data in OneLake. An ontology can use Graph for questions about connections.", "simple_example": "Graph finds all stores that sell a product from a supplier that has a delay.", "programmer_analogy": "It is like a graph database, for example Neo4j, where you follow edges instead of writing many SQL joins.", "why_it_matters": "Some business questions need many connection steps, and Graph answers them faster than tables.", "related_terms": [8, 13, 17], "common_mistake": "Do not mix Graph in Microsoft Fabric with Microsoft Graph. Microsoft Graph is a different API for Microsoft 365 data."}, {"id": 21, "term": "Plan", "category": "process", "definition": "Plan is the planning part of Fabric IQ. It lets users make budgets, forecasts, and scenarios in sheets that look like spreadsheets. It uses Power BI semantic models and can write results to a SQL database in Fabric.", "simple_example": "The finance team uses Plan to make the sales budget for each store for the next year.", "programmer_analogy": "It is like a shared spreadsheet that reads from and writes to the company database.", "why_it_matters": "Plan puts targets and forecasts on the same data and business logic as the reports.", "related_terms": [10, 12], "common_mistake": "Do not think that Plan is a project plan or a task list. It is for financial and business planning."}, {"id": 22, "term": "data agent", "category": "agents", "definition": "A data agent is an item that answers natural-language questions about Fabric data. It uses a large language model (LLM) to make queries, so users do not write SQL. It can only read data, and it uses the permissions of the user.", "simple_example": "A store manager asks: 'Which 5 products sold the most last week?' The data agent gives the answer.", "programmer_analogy": "It is like a text-to-SQL chatbot with access control from the database.", "why_it_matters": "A data agent is the main way for people and other agents to ask questions about Fabric data.", "related_terms": [9, 10, 13, 24], "common_mistake": "Do not think that a data agent can change data. It only reads data."}, {"id": 23, "term": "operations agent", "category": "agents", "definition": "An operations agent is an item that monitors data all the time. It checks conditions on the data at intervals. When a condition is true, it sends a message or recommends an action.", "simple_example": "An operations agent sends a Microsoft Teams message when the stock of a product in a store falls below 10 units.", "programmer_analogy": "It is like a monitoring alert with a cron schedule that calls a webhook.", "why_it_matters": "An operations agent turns business meaning into action, not only into answers.", "related_terms": [13, 19, 22], "common_mistake": "Do not mix the rules of an operations agent with ontology rules. An operations agent rule is a query with a condition, and an ontology rule is natural-language context."}, {"id": 24, "term": "MCP (Model Context Protocol)", "category": "agents", "definition": "The Model Context Protocol (MCP) is an open standard that lets AI agents find and use external tools and data. An MCP server supplies the tools. Fabric IQ has an MCP server for each ontology.", "simple_example": "A coding agent in VS Code connects to the ontology MCP server and asks for the sales of each store.", "programmer_analogy": "It is like a standard plugin API, for example the Language Server Protocol, but for LLM tools.", "why_it_matters": "MCP lets agents outside Microsoft Fabric use the ontology.", "related_terms": [13, 22, 25, 26], "common_mistake": "Do not think that MCP is a Microsoft protocol only. It is an open standard that many AI tools use."}, {"id": 25, "term": "Work IQ", "category": "agents", "definition": "Work IQ is a Microsoft 365 layer that gives agents context about how people work. It uses mail, calendars, files, chats, people data, and sites. Agents get access through an MCP server, an API, or agent-to-agent (A2A) calls.", "simple_example": "An agent uses Work IQ to find the email where the regional manager approved a price change.", "programmer_analogy": "It is like a search API over the company inbox, calendar, and shared drive, with access control.", "why_it_matters": "Work IQ gives the people context, and Fabric IQ gives the business data context.", "related_terms": [24, 26, 27], "common_mistake": "Do not think that Work IQ is a part of Microsoft Fabric. It is a part of Microsoft 365."}, {"id": 26, "term": "Foundry IQ", "category": "agents", "definition": "Foundry IQ is a knowledge layer in Microsoft Foundry that gives agents access to documents. You make a knowledge base that points to knowledge sources. An LLM plans the searches and returns answers with citations.", "simple_example": "An agent uses Foundry IQ to find the return policy in the store policy documents.", "programmer_analogy": "It is like a managed Retrieval-Augmented Generation (RAG) service with access control.", "why_it_matters": "Foundry IQ gives the document and policy context, and Fabric IQ gives the business data context.", "related_terms": [24, 25, 27], "common_mistake": "Do not mix Foundry IQ with Fabric IQ. Foundry IQ is for documents, and Fabric IQ is for business data."}, {"id": 27, "term": "Microsoft IQ", "category": "platform", "definition": "Microsoft IQ is the name for the group of Microsoft context layers for AI agents. It contains Fabric IQ, Work IQ, Foundry IQ, and Web IQ. Web IQ gives context from the public web.", "simple_example": "A retail agent uses Fabric IQ for sales data, Work IQ for emails, and Foundry IQ for policy documents.", "programmer_analogy": "It is like a set of separate microservices that together give one complete context to a client.", "why_it_matters": "This name shows where Fabric IQ fits among the other Microsoft context layers.", "related_terms": [12, 25, 26], "common_mistake": "Do not think that Microsoft IQ is one product that you buy. It is a group name for different products."}], "C": [{"id": 1, "name": "The container chain: capacity -> workspace -> item", "parts_involved": ["Microsoft Fabric (1)", "capacity (2)", "capacity unit (CU) (3)", "F2 (F SKU) (4)", "workload (5)", "workspace (6)", "item (7)", "OneLake (8)"], "one_sentence_summary": "The capacity supplies and bills the compute, the workspace sets ownership and access, and the item is the object that does the work.", "flow_steps": [{"step": 1, "action": "The company buys a capacity in Azure, for example an F64 (F SKU) with 64 CUs.", "produces": "A pool of compute and one monthly bill for that capacity."}, {"step": 2, "action": "An administrator creates the workspace 'Store Sales' and assigns it to the capacity.", "produces": "A container whose items all use compute from that capacity."}, {"step": 3, "action": "The workspace Admin gives workspace roles to people: Admin, Member, Contributor, or Viewer.", "produces": "An access list. Each person gets the highest role from all role assignments."}, {"step": 4, "action": "Members and Contributors create items, for example a lakehouse, a notebook, and a report.", "produces": "Items in the workspace. Each item type comes from a workload."}, {"step": 5, "action": "When an item runs, for example a notebook job, it consumes CUs from the capacity.", "produces": "Compute use that the capacity owner pays for and can monitor."}], "final_output": "A clear model of who pays (the capacity owner), who owns (the workspace Admins), and who sees what (the workspace roles and item permissions).", "mini_example": "Capacity  \"Retail-F64\"         (who pays: the central IT budget)\n |- Workspace \"Store Sales\"    (who owns: the sales data lead, Admin)\n |    |- Item: lakehouse  \"SalesLakehouse\"\n |    |- Item: notebook   \"CleanOrders\"\n |    |- Item: report     \"Daily Store Sales\"\n |- Workspace \"Finance\"      (who owns: the finance lead, Admin)\n      |- Item: report     \"Monthly Margin\"\n\nRole           Can create items   Can read data with Spark   Can read with T-SQL\nAdmin          yes                yes                        yes\nMember         yes                yes                        yes\nContributor    yes                yes                        yes\nViewer         no                 no                         yes\n", "if_a_part_is_missing": "Without a capacity, the workspace cannot run Fabric items. Without a workspace, you have no place to create items and no access control. Without items, the capacity is a bill with no output.", "common_mistake": "Do not think that the Viewer role can read lakehouse files with Spark or OneLake APIs. A Viewer can read data only through T-SQL on the SQL analytics endpoint."}, {"id": 2, "name": "The data chain: source data -> OneLake -> lakehouse (Delta tables) -> SQL query", "parts_involved": ["workload (5)", "item (7)", "OneLake (8)", "lakehouse (9)"], "one_sentence_summary": "Data goes into OneLake one time as Delta tables in a lakehouse, and then many tools read the same files.", "flow_steps": [{"step": 1, "action": "A Data Factory pipeline copies the orders from the POS database into the lakehouse 'SalesLakehouse'.", "produces": "Raw files and tables in OneLake."}, {"step": 2, "action": "A Spark notebook cleans the raw data and writes the tables 'orders', 'products', 'stores', and 'customers'.", "produces": "Delta tables (Parquet files plus a transaction log) in the lakehouse in OneLake."}, {"step": 3, "action": "Fabric automatically creates a SQL analytics endpoint for the lakehouse.", "produces": "A read-only Transact-SQL (T-SQL) interface on the same Delta tables."}, {"step": 4, "action": "An analyst writes a SELECT query on the SQL analytics endpoint.", "produces": "A query result from the same files that Spark wrote. Fabric makes no copy."}], "final_output": "One copy of clean retail data in OneLake that Spark, T-SQL, and Power BI can all read.", "mini_example": "-- Step 2: Spark writes a Delta table (PySpark)\ndf_clean.write.format(\"delta\").mode(\"overwrite\").saveAsTable(\"orders\")\n\n-- Step 4: T-SQL reads the same table on the SQL analytics endpoint\nSELECT s.store_name, SUM(o.amount) AS sales\nFROM dbo.orders AS o\nJOIN dbo.stores AS s ON s.store_id = o.store_id\nWHERE o.order_date = '2026-11-06'\nGROUP BY s.store_name;\n", "if_a_part_is_missing": "Without OneLake, each tool keeps its own copy, and the copies can show different values. Without the Delta format, other engines cannot read the tables as tables. Without the SQL analytics endpoint, SQL users must use Spark.", "common_mistake": "Do not try to INSERT, UPDATE, or DELETE through the SQL analytics endpoint. It is read-only. Use Spark or a pipeline to change lakehouse tables."}, {"id": 3, "name": "The meaning chain: lakehouse table -> Power BI semantic model -> report", "parts_involved": ["lakehouse (9)", "Power BI semantic model (10)", "item (7)", "OneLake (8)"], "one_sentence_summary": "A Power BI semantic model adds relationships and measures to lakehouse tables, so all reports calculate a number in the same way.", "flow_steps": [{"step": 1, "action": "A data modeler creates a Power BI semantic model on the lakehouse tables in Direct Lake mode.", "produces": "A model that reads the Delta tables in OneLake and does not import a copy."}, {"step": 2, "action": "The modeler adds relationships, for example orders[store_id] to stores[store_id].", "produces": "Filter paths. A filter on a store also filters the orders of that store."}, {"step": 3, "action": "The modeler writes measures in Data Analysis Expressions (DAX), for example 'Net Sales'.", "produces": "One named and tested calculation for each business number."}, {"step": 4, "action": "Report authors build reports that use the measures.", "produces": "Many reports that show the same value for the same filter."}, {"step": 5, "action": "Other tools, for example Excel or a data agent, query the same semantic model.", "produces": "The same number in every tool, because every tool calls the same measure."}], "final_output": "One trusted definition of each business number, for example 'Net Sales', that all reports and tools use.", "mini_example": "-- Measures in the semantic model (DAX)\nNet Sales     = SUM(orders[amount]) - SUM(orders[refund_amount])\nMargin %      = DIVIDE([Net Sales] - SUM(orders[cost]), [Net Sales])\n\n-- Before: two teams write their own SQL\nSales team:   SELECT SUM(amount) FROM orders;                     -> 1,250,000\nFinance team: SELECT SUM(amount - refund_amount) FROM orders;     -> 1,180,000\n\n-- After: both reports use [Net Sales]                            -> 1,180,000\n", "if_a_part_is_missing": "Without relationships, a filter on a store does not filter the orders, so totals are wrong. Without measures, each report author writes a different formula, and reports disagree. Without the lakehouse table, the model has no data.", "common_mistake": "Do not put business formulas in each report. Put them as measures in the semantic model, so that all reports use one definition."}, {"id": 4, "name": "Same data, many workloads", "parts_involved": ["workload (5)", "item (7)", "OneLake (8)", "lakehouse (9)", "Power BI semantic model (10)"], "one_sentence_summary": "All Fabric engines store and read tables in OneLake in the open Delta Parquet format, so workloads share data without copies.", "flow_steps": [{"step": 1, "action": "The Data Engineering workload writes the 'orders' Delta table with Spark.", "produces": "One set of Delta Parquet files in OneLake."}, {"step": 2, "action": "The Data Warehouse engine reads the table through the SQL analytics endpoint.", "produces": "SQL results from the same files."}, {"step": 3, "action": "Power BI reads the table through a semantic model in Direct Lake mode.", "produces": "Report values from the same files."}, {"step": 4, "action": "A second workspace, 'Finance', adds a OneLake shortcut to the 'orders' table.", "produces": "A pointer to the table, like a symbolic link. The data stays in one place."}], "final_output": "One physical copy of each table, with many workloads that read it, and less data movement and fewer refresh jobs.", "mini_example": "OneLake: /Store Sales/SalesLakehouse/Tables/orders  (Delta Parquet, 1 copy)\n   ^ Spark notebook       (writes and reads)\n   ^ SQL analytics endpoint (reads with T-SQL)\n   ^ semantic model       (reads in Direct Lake mode)\n   ^ Finance workspace    (reads through a shortcut)\n\nWithout OneLake (classic stack):\nPOS DB -> copy -> data lake -> copy -> warehouse -> copy -> BI import\n", "if_a_part_is_missing": "Without the shared Delta format, each engine needs its own copy and its own load job. Without shortcuts, the 'Finance' workspace must copy the 'orders' table and keep the copy current.", "common_mistake": "Do not think that a shortcut is a copy. If someone deletes or moves the target table, the shortcut stops working."}, {"id": 5, "name": "Preview vs GA as a decision rule", "parts_involved": ["preview vs GA (general availability) (11)", "item (7)", "workload (5)"], "one_sentence_summary": "Use GA components for the production path, and use preview components only where a change or a failure does not stop the business.", "flow_steps": [{"step": 1, "action": "List each component that the project uses, for example lakehouse, semantic model, and ontology.", "produces": "A component list."}, {"step": 2, "action": "Find the status of each component on its Microsoft Learn page, and record the page date.", "produces": "A status table with a date for each line."}, {"step": 3, "action": "Put each component in one of two paths: the production path or the trial path.", "produces": "A production path with only GA components, and a trial path with preview components."}, {"step": 4, "action": "For each preview component, write a fallback that uses GA components only.", "produces": "A plan that continues to operate if the preview component changes."}, {"step": 5, "action": "Examine the status again at each release, and move components to production when they become GA.", "produces": "A current component list."}], "final_output": "A project design where the main business numbers do not depend on preview components.", "mini_example": "Component                  Status (see status_note)   Path\nlakehouse                  GA                          production\nPower BI semantic model    GA                          production\ndata agent                 GA                          production, with review\nontology                   preview                     trial\nFallback for ontology: the data agent uses the semantic model as its data source.\n", "if_a_part_is_missing": "Without a status check, a preview change can break a production report or agent with no SLA. Without a fallback, the business loses the function until Microsoft fixes it.", "common_mistake": "Do not think that a GA item makes all its functions GA. A GA item can contain preview functions, for example some Direct Lake functions."}, {"id": 6, "name": "The semantic gap", "parts_involved": ["lakehouse (9)", "Power BI semantic model (10)", "data agent (22)", "Fabric IQ (12)"], "one_sentence_summary": "Raw tables have technical names and hidden rules, so an AI agent can write correct SQL that gives a wrong business answer.", "flow_steps": [{"step": 1, "action": "A store manager asks an agent: 'What were the net sales of the Chennai store last week?'", "produces": "A question in business words."}, {"step": 2, "action": "The agent reads only the raw table schema of the lakehouse.", "produces": "Column names such as 'st_cd', 'amt', and 'sts', with no business meaning."}, {"step": 3, "action": "The agent guesses the meaning of each column and writes SQL.", "produces": "A query that runs but can use the wrong columns or miss a filter."}, {"step": 4, "action": "The agent uses a semantic layer that contains names, relationships, and measures.", "produces": "A query that uses the approved definition of 'net sales'."}], "final_output": "An understanding of why an agent needs business meaning in addition to tables.", "mini_example": "Raw table: ord_hdr\nord_no | st_cd | amt    | sts | ref_amt\n10021  | CH01  | 1500.0 | C   | 0.0\n10022  | CH01  | 900.0  | X   | 0.0      <- 'X' means cancelled\n10023  | CH01  | 700.0  | C   | 200.0\n\nBefore (agent guesses from raw columns):\nSELECT SUM(amt) FROM ord_hdr WHERE st_cd = 'CH01';      -> 3100.0  (wrong)\n\nAfter (agent uses the semantic layer: Net Sales excludes cancelled orders and refunds):\nSELECT SUM(amt - ref_amt) FROM ord_hdr\nWHERE st_cd = 'CH01' AND sts <> 'X';                     -> 2000.0  (correct)\n", "if_a_part_is_missing": "Without a semantic layer, the agent does not know that 'sts = X' means cancelled or that 'CH01' is the Chennai store. The SQL runs, but the answer is wrong, and nobody sees an error.", "common_mistake": "Do not think that SQL with no error gives a correct answer. The semantic gap gives wrong answers that look correct."}, {"id": 7, "name": "Preview of lesson 5: the business-meaning layer", "parts_involved": ["Fabric IQ (12)", "ontology (13)", "binding (data binding) (18)", "data agent (22)", "lakehouse (9)", "Power BI semantic model (10)"], "one_sentence_summary": "Fabric IQ adds an ontology with bindings on top of the data chain and the meaning chain, and a data agent uses it to answer in business words.", "flow_steps": [{"step": 1, "action": "An ontology defines the entity types Customer, Order, Product, and Store, and their relationships.", "produces": "A business vocabulary that a computer can read."}, {"step": 2, "action": "Bindings connect the ontology parts to lakehouse tables and columns, for example 'Store' to 'stores.store_id'.", "produces": "Business concepts that point to live data, with no copy."}, {"step": 3, "action": "A data agent uses the ontology as a data source.", "produces": "Answers in business words, from data in OneLake."}], "final_output": "A business-meaning layer above concept 2 (data chain) and concept 3 (meaning chain). Lesson 5 teaches it in full.", "mini_example": "Business concept      binding              lakehouse column\nStore.Code       ->   binds to        ->   ord_hdr.st_cd\nOrder.Status     ->   binds to        ->   ord_hdr.sts  ('X' = Cancelled)\nOrder.Refund     ->   binds to        ->   ord_hdr.ref_amt\n", "if_a_part_is_missing": "Without bindings, the ontology has definitions but no data. Without the ontology, the data agent depends only on table names and the semantic model.", "common_mistake": "Do not think that the ontology replaces the lakehouse or the semantic model. It adds a layer on top of them."}]};
const CATC={platform:1,data:2,semantics:3,process:4,agents:6};
let jtab='terms',jq='',jcat='all',jopen={};
function renderJargon(){
  view='jargon';sess=null;
  const q=jq.trim().toLowerCase();
  const byId={};REF.T.forEach(t=>byId[t.id]=t);
  let body='';
  if(jtab==='terms'){
    const cats=['all',...Array.from(new Set(REF.T.map(t=>t.category)))];
    const list=REF.T.filter(t=>(jcat==='all'||t.category===jcat)&&(!q||(t.term+' '+t.definition+' '+t.simple_example).toLowerCase().includes(q)));
    body=`<div class="chips" style="margin-bottom:12px">${cats.map(c=>`<button type="button" class="chip ${jcat===c?'sel':''}" data-jcat="${c}">${esc(c)}</button>`).join('')}</div>
    <div class="jl">${list.map(t=>{const o=jopen['t'+t.id];return `<div class="jt" style="--zc:var(--z${CATC[t.category]||5})"><button type="button" data-jo="t${t.id}" aria-expanded="${!!o}"><span>${t.id}. ${esc(t.term)}</span><span class="sub">${esc(t.category)}</span></button>${o?`<div class="jb"><p>${esc(t.definition)}</p><div class="ex"><b>Retail example</b>${esc(t.simple_example)}</div><div class="ex"><b>Programmer analogy</b>${esc(t.programmer_analogy)}</div><p><b>Why it matters:</b> ${esc(t.why_it_matters)}</p><div class="mis"><b>Common mistake</b>${esc(t.common_mistake)}</div>${canAsk()?`<div class="row" style="margin:0"><button type="button" class="btn" data-askterm="${t.id}">Ask the teacher about this</button></div>`:''}<div class="rel"><span class="lab" style="margin:0">Related</span>${(t.related_terms||[]).filter(r=>byId[r]).map(r=>`<button type="button" class="chip" data-jgo="${r}">${esc(byId[r].term)}</button>`).join('')}</div></div>`:''}</div>`}).join('')||'<p class="sub">No terms match.</p>'}</div>`;
  }else{
    const list=REF.C.filter(c=>!q||(c.name+' '+c.one_sentence_summary+' '+c.mini_example).toLowerCase().includes(q));
    body=`<div class="jl">${list.map(c=>{const o=jopen['c'+c.id];return `<div class="jt" style="--zc:var(--z${(c.id%6)+1})"><button type="button" data-jo="c${c.id}" aria-expanded="${!!o}"><span>${esc(c.name)}</span></button><div class="jb" style="${o?'':'padding-bottom:12px'}"><p>${esc(c.one_sentence_summary)}</p>${o?`<div class="rel">${(c.parts_involved||[]).map(p=>`<span class="pip">${esc(p)}</span>`).join('')}</div><ol class="fl">${(c.flow_steps||[]).map(f=>`<li>${esc(f.action)} <span class="sub">Produces: ${esc(f.produces)}</span></li>`).join('')}</ol><p><b>Final output:</b> ${esc(typeof c.final_output==='string'?c.final_output:JSON.stringify(c.final_output))}</p><div class="ex"><b>Mini example</b>${esc(typeof c.mini_example==='string'?c.mini_example:JSON.stringify(c.mini_example))}</div><div class="mis"><b>If a part is missing</b>${esc(typeof c.if_a_part_is_missing==='string'?c.if_a_part_is_missing:JSON.stringify(c.if_a_part_is_missing))}</div><div class="mis"><b>Common mistake</b>${esc(c.common_mistake)}</div>`:''}</div></div>`}).join('')||'<p class="sub">No concepts match.</p>'}</div>`;
  }
  setApp(`<section class="panel"><div class="sect-h"><h2>Jargon and concepts</h2><div class="tabs"><button type="button" class="btn ${jtab==='terms'?'on':''}" data-jtab="terms">Words (${REF.T.length})</button><button type="button" class="btn ${jtab==='concepts'?'on':''}" data-jtab="concepts">Concepts (${REF.C.length})</button></div></div>
  <input class="search" id="jsearch" type="search" placeholder="Search" aria-label="Search" value="${esc(jq)}" style="margin-bottom:12px">${body}</section>`);
  const si=$('#jsearch');
  si.oninput=()=>{jq=si.value;const p=si.selectionStart;renderJargon();const n=$('#jsearch');n.focus();n.setSelectionRange(p,p)};
}


/* ===== GUIDED COURSE + VECTORLESS RAG (Claude is the brain; the page is the UI) ===== */
let SAMPLE=null;
/* ---- Provider adapter: 'claude' (artifact sample) | 'gemini' | 'openrouter' (both via your proxy, see worker.js) ---- */
const DEF_OR_MODEL='deepseek/deepseek-v4.1-flash-1017',DEF_GEM_MODEL='gemini-2.5-flash-lite';
/* Default teacher: DeepSeek V4.1 Flash (1017) on OpenRouter. OpenRouter list price when set: $0.15 in / $0.60 out per 1M tokens, JSON mode supported. Prices change, edit them in the settings panel. */
let CFG={provider:(window.claude?'claude':'openrouter'),model:DEF_OR_MODEL,key:'',remember:false,proxy:'',pin:0.15,pout:0.60,tokLimit:100000};
/* Settings live in localStorage WITHOUT the key. The key lives in sessionStorage (cleared when the tab closes)
   unless "Remember on this device" is ticked, then in localStorage under its own name. */
try{
  const r=localStorage.getItem('fiq-cfg');
  if(r){const o=JSON.parse(r);
    if(o.key){try{sessionStorage.setItem('fiq-key',o.key)}catch(e){}delete o.key}   /* migrate old saved key out of the settings blob */
    CFG=Object.assign(CFG,o);localStorage.setItem('fiq-cfg',JSON.stringify(Object.assign({},CFG,{key:''})))}
  const kl=localStorage.getItem('fiq-key');
  CFG.remember=!!kl;
  CFG.key=sessionStorage.getItem('fiq-key')||kl||'';
  /* untouched old default (Gemini, no key, no proxy) moves to the new default; anything you set yourself is kept */
  if(CFG.provider==='gemini'&&CFG.model===DEF_GEM_MODEL&&!CFG.key&&!CFG.proxy)Object.assign(CFG,{provider:window.claude?'claude':'openrouter',model:DEF_OR_MODEL,pin:0.15,pout:0.60});
}catch(e){}
const saveCfg=()=>{try{
  const o=Object.assign({},CFG);delete o.key;
  localStorage.setItem('fiq-cfg',JSON.stringify(o));
  localStorage.removeItem('fiq-key');sessionStorage.removeItem('fiq-key');
  if(CFG.key)(CFG.remember?localStorage:sessionStorage).setItem('fiq-key',CFG.key);
}catch(e){}};
S.tok=S.tok||{i:0,o:0,n:0};
