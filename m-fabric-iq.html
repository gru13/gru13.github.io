even when no condition is true.\n  - The stock of 'Basmati Rice 5 kg' at CH01 falls to 7 units, so the condition becomes true.\n  - The agent uses an LLM to analyze the data and to make a recommendation.\n  - The agent sends a Teams message to the Chennai store manager with the recommendation.\n  - The store manager approves the recommendation.\n  - The agent runs the action on behalf of the creator, for example a Power Automate flow that creates a restock request.\naction: A Teams message, then a restock request after approval. The action runs with the permissions of the creator, and the agent has its own Microsoft Entra Agent ID."},{"i":"L5.external_access_mcp.what_it_is","l":5,"t":"L5 > external_access_mcp > what_it_is","x":"The Model Context Protocol (MCP) is an open standard for agents to call external tools. Each ontology can act as an MCP server at a URL built from the workspace ID and the ontology item ID. VS Code agent mode and Copilot Studio are documented clients. Agent 365 lists it as 'Fabric IQ Ontology MCP'."},{"i":"L5.external_access_mcp.what_an_external_agent_can_do","l":5,"t":"L5 > external_access_mcp > what_an_external_agent_can_do","x":"- List entity types with their property names, property types, and telemetry (tool 'list_ontology_entity_types').\n- Ask a natural-language question on the ontology data and get JSON results and an optional natural-language answer (tool 'search_ontology').\n- Read business rules with their links and metadata (tool 'list_ontology_rules').\n- Example: a coding agent in VS Code reads the Order and Store definitions before it writes a new Spark notebook for 'SalesLakehouse'.\n- Microsoft Learn documents no write tools. All documented tools read data or definitions."},{"i":"L5.external_access_mcp.permissions","l":5,"t":"L5 > external_access_mcp > permissions","x":"The user signs in with their own credentials, and the ontology applies the access of that user to the bound data, including OneLake security and source RLS, OLS, and CLS. Service principals do not work now (known issue). The capacity must be F2 or larger, or Premium P1 or larger. The ontology tenant settings must be on. Agent 365 governance needs a Microsoft 365 Copilot license. The Copilot Studio scope is 'McpServers.FabricIQOntology.All'."},{"i":"L5.external_access_mcp.status","l":5,"t":"L5 > external_access_mcp > status","x":"Preview (Use the ontology MCP server, Microsoft Learn, updated 2026-10-01; Fabric IQ Ontology MCP in Copilot Studio, updated 2026-08-04, metadata 2026-10-20). Microsoft says that tool names and parameters can change."},{"i":"L5.microsoft_iq_family.0","l":5,"t":"L5 > microsoft_iq_family > 0","x":"layer: Fabric IQ\ncontext_it_gives: Business data context: entities, relationships, rules, and measures over data in OneLake.\nretail_example: The net sales of each store, and the stores with low stock.\nstatus: Preview workload name 'IQ (preview)' (2026-09-29). Fabric IQ in Copilot Chat and Cowork is GA (Azure blog, 2026-09-28). The Foundry Fabric IQ tool is preview (2026-10-23)."},{"i":"L5.microsoft_iq_family.1","l":5,"t":"L5 > microsoft_iq_family > 1","x":"layer: Work IQ\ncontext_it_gives: Context about how people work: mail, calendar, files, people, chat, and sites in Microsoft 365, plus Dynamics 365 and Power Platform data. Access is through A2A, a remote MCP server, and a REST API.\nretail_example: The email where the regional manager approved a price change for the Chennai store.\nstatus: Not labeled on the Work IQ overview (updated 2026-11-05). It uses usage-based billing with Copilot Credits."},{"i":"L5.microsoft_iq_family.2","l":5,"t":"L5 > microsoft_iq_family > 2","x":"layer: Foundry IQ\ncontext_it_gives: Document and policy context from knowledge bases over Azure Blob Storage, SharePoint, OneLake, and the web, with citations and permission checks.\nretail_example: The return policy for loyalty customers from the store policy documents.\nstatus: Mixed. Some functions are GA and some are preview (What is Foundry IQ?, updated 2026-11-06)."},{"i":"L5.microsoft_iq_family.3","l":5,"t":"L5 > microsoft_iq_family > 3","x":"layer: Web IQ\ncontext_it_gives: Context from the public web: web pages, news, images, and videos, through grounding APIs on the Bing index.\nretail_example: Public news about a supplier delay or a festival that changes demand in Chennai.\nstatus: Unclear. Microsoft announced it on 2026-06-02 with a sign-up page and gave no preview or GA label. I did not find a Microsoft Learn page for it."},{"i":"L5.governance_and_security.0","l":5,"t":"L5 > governance_and_security > 0","x":"topic: Access to the ontology item\nexplanation: Fabric workspace roles and item permissions control the ontology. You can share an ontology with read, edit, and reshare permissions.\nstatus_or_unclear: Verified (Ontology overview, 2026-10-16). The sharing permissions come from a Microsoft Fabric blog post."},{"i":"L5.governance_and_security.1","l":5,"t":"L5 > governance_and_security > 1","x":"topic: Access to bound data\nexplanation: Authoring and querying use the access of the user to the bound data. OneLake security and source RLS, OLS, and CLS apply. Access to the ontology does not give access to the data.\nstatus_or_unclear: Verified (Ontology overview, 2026-10-16)."},{"i":"L5.governance_and_security.2","l":5,"t":"L5 > governance_and_security > 2","x":"topic: Ontology agent roles\nexplanation: A Viewer can explain and query an ontology. A Contributor or higher can create, improve, and apply changes. The agent uses the identity of the user.\nstatus_or_unclear: Verified (How to use the ontology agent, 2026-09-29)."},{"i":"L5.governance_and_security.3","l":5,"t":"L5 > governance_and_security > 3","x":"topic: Semantic model as a source\nexplanation: You need Read and Build permissions on the semantic model to generate an ontology from it or to query it through the ontology.\nstatus_or_unclear: Verified (Generate an ontology, 2026-09-29; Data binding, 2026-10-21)."},{"i":"L5.governance_and_security.4","l":5,"t":"L5 > governance_and_security > 4","x":"topic: Data agent\nexplanation: Queries run with the identity of the user. Sharing a data agent does not give access to its sources. Purview DLP policies can block queries.\nstatus_or_unclear: Verified (Data agent concepts, 2026-05-11; Ontology as context, 2026-10-05). Purview functions for agents are preview."},{"i":"L5.governance_and_security.5","l":5,"t":"L5 > governance_and_security > 5","x":"topic: Operations agent\nexplanation: The agent has its own Microsoft Entra Agent ID, but runs in delegated mode with the identity of the creator. So an approved action can reach all data that the creator can reach. Choose the creator carefully.\nstatus_or_unclear: Verified (Operations agent, 2026-10-21)."},{"i":"L5.governance_and_security.6","l":5,"t":"L5 > governance_and_security > 6","x":"topic: Graph\nexplanation: OneLake security, workspace RBAC, and Fabric compliance and audit govern Graph.\nstatus_or_unclear: Verified at a high level (Graph overview, 2026-05-20). It is unclear how row-level rules apply to graph data that Graph caches. I did not verify this."},{"i":"L5.governance_and_security.7","l":5,"t":"L5 > governance_and_security > 7","x":"topic: Network isolation\nexplanation: Ontology supports tenant-level Private Link. Data agents support tenant-level and workspace-level Private Link. Semantic models support public access only for the Foundry Fabric IQ tool.\nstatus_or_unclear: Verified (Connect Fabric IQ to Foundry agents, 2026-10-23)."},{"i":"L5.governance_and_security.8","l":5,"t":"L5 > governance_and_security > 8","x":"topic: Data residency for AI\nexplanation: The ontology agent, the data agent, and the operations agent can need a tenant setting for cross-geo AI processing when the capacity is outside US or EU regions. The Foundry page says data can be processed outside your Azure compliance boundary.\nstatus_or_unclear: Verified (ontology agent 2026-09-29; data agent 2026-05-11; operations agent 2026-10-21; Foundry tool 2026-10-23)."},{"i":"L5.governance_and_security.9","l":5,"t":"L5 > governance_and_security > 9","x":"topic: Conversation data\nexplanation: Ontology agent conversations can be kept for up to two days. Customer-managed keys are not supported for them.\nstatus_or_unclear: Verified (How to use the ontology agent, 2026-09-29)."},{"i":"L5.cost_and_capacity.0","l":5,"t":"L5 > cost_and_capacity > 0","x":"topic: Ontology meters\nexplanation: Three meters: Ontology Discovery (1,000 CU-seconds for each read of the definition), Ontology Logic and Operations (child items such as Eventhouse and Graph, at their own rates), and Ontology AI Reasoning (MCP server and ontology agent, based on tokens). The page table marks Discovery and AI Reasoning as not billable. Confirm this before you plan costs. Microsoft gives examples of about 0.5 to 1 CU-hours for a light edit and about 20 CU-hours for heavy generation.\nverified_source: Ontology capacity usage (preview), Microsoft Learn, updated 2026-10-14"},{"i":"L5.cost_and_capacity.1","l":5,"t":"L5 > cost_and_capacity > 1","x":"topic: Capacity size for the ontology\nexplanation: Microsoft Learn suggests F8 for evaluation and F4 for light tests. Ontology definitions in OneLake use standard OneLake storage rates.\nverified_source: Ontology capacity usage (preview), Microsoft Learn, updated 2026-10-14"},{"i":"L5.cost_and_capacity.2","l":5,"t":"L5 > cost_and_capacity > 2","x":"topic: Graph\nexplanation: No separate license. Compute uses 10 CU-seconds for each second of uptime, rounded up to the minute for each session. Storage uses the OneLake Cache rate. Graph stops automatically when idle.\nverified_source: Graph in Microsoft Fabric overview, Microsoft Learn, updated 2026-05-20"},{"i":"L5.cost_and_capacity.3","l":5,"t":"L5 > cost_and_capacity > 3","x":"topic: Data agent\nexplanation: The 'AI Query' meter uses 100 CU-seconds for each 1,000 input tokens, 10 for cached input, and 400 for output. The generated query is billed to its engine, for example SQL Query. It runs as a background job. A paid F2 or larger capacity or P1 or larger is necessary.\nverified_source: Data agent consumption, Microsoft Learn, updated 2026-07-22; Data agent concepts, 2026-05-11"},{"i":"L5.cost_and_capacity.4","l":5,"t":"L5 > cost_and_capacity > 4","x":"topic: Operations agent\nexplanation: Compute uses 0.46 CU-hours for each hour after activation, also when no condition is true. Autonomous reasoning uses 400 CU-seconds per 1,000 input tokens and 1,600 per 1,000 output tokens. Copilot configuration, eventhouse queries, OneLake storage for 30 days of monitored data, and Power Automate licenses add cost.\nverified_source: Operations agent billing, Microsoft Learn, updated 2026-08-04 (metadata 2026-10-06)"},{"i":"L5.cost_and_capacity.5","l":5,"t":"L5 > cost_and_capacity > 5","x":"topic: Plan\nexplanation: Plan is part of the Fabric SKU and has new billing meters. Microsoft Learn gives no rates on the overview. Each plan item creates a SQL database in Fabric, which also uses capacity.\nverified_source: Plan overview, Microsoft Learn, updated 2026-08-31; Prerequisites for planning, updated 2026-10-01"},{"i":"L5.cost_and_capacity.6","l":5,"t":"L5 > cost_and_capacity > 6","x":"topic: Licenses outside Fabric\nexplanation: The Foundry Fabric IQ tool needs a Fabric license for each user who calls it. Agent 365 governance of the MCP server needs a Microsoft 365 Copilot license. Work IQ uses Copilot Credits.\nverified_source: Connect Fabric IQ to Foundry agents, 2026-10-23; Fabric IQ Ontology MCP (Copilot Studio), 2026-08-04; Work IQ overview, 2026-11-05"},{"i":"L5.cost_and_capacity.7","l":5,"t":"L5 > cost_and_capacity > 7","x":"topic: Throttling\nexplanation: Agent work runs as background jobs, so smoothing over 24 hours applies (lesson 4). If the capacity stays over its limit for 24 hours, background jobs are rejected and operations agents stop.\nverified_source: Operations agent billing, Microsoft Learn, 2026-08-04; Data agent consumption, 2026-07-22"},{"i":"L5.strengths","l":5,"t":"L5 > strengths","x":"- The ontology closes the semantic gap with business names, relationships, and rules that every agent reads.\n- Bindings point to data in place, so the ontology adds no data copy (lesson 4 'fewer data copies').\n- One ontology serves many consumers: the data agent, the operations agent, the ontology agent, Foundry, Copilot Studio, and VS Code through MCP.\n- It can start from an existing semantic model, so tested DAX measures become metrics.\n- It combines static data from a lakehouse and time-series data from an eventhouse in one entity type.\n- Queries run with the identity of the user, so OneLake security and RLS still apply.\n- The ontology agent shows the query it ran and says when a query returns no rows.\n- Plan uses the same semantic models as reports, so budgets and actuals use one definition."},{"i":"L5.weak_points_and_limits","l":5,"t":"L5 > weak_points_and_limits","x":"- The ontology and most of its functions are preview, with no SLA. The old experience retires on 2027-01-31, and some migrations fail (composite keys).\n- Rules are text only. The ontology does not enforce them, so a wrong answer is still possible.\n- The data agent with an ontology is preview, had an outage (2026-10-05), and does not work with semantic model bindings.\n- Each data agent question goes to one source, with no joins across sources.\n- Bindings do not refresh automatically. The data agent refreshes ontology context every 10 minutes.\n- Known issues: no Decimal in Graph, no external lakehouse tables, unique relationship names, no service principal for MCP.\n- Cost is hard to predict: tokens, Graph uptime, and always-on operations agent compute all use CUs.\n- Operations agent actions run with the permissions of the creator.\n- Microsoft Learn pages disagree on status and dates for several components.\n- Data agent answers are capped at 25 rows and 25 columns, and English gives the best results."},{"i":"L5.agent_comparison","l":5,"t":"L5 > agent_comparison","x":"-\n  approach: semantic model only\n  how_it_answers: The data agent writes DAX on the semantic model and calls tested measures, for example [Net Sales].\n  good_for: Report-style questions about numbers that the model already defines. It is the GA path.\n  risk: Questions outside the model, for example live stock in an eventhouse, have no answer. The model has no natural-language rules.\n-\n  approach: ontology\n  how_it_answers: The agent reads entity types, relationships, and rules, chooses one bound source, and writes SQL, KQL, or DAX for it.\n  good_for: Questions in business words across concepts and sources, for example sales plus stock for one store, and use by many agents through MCP.\n  risk: Preview status, known issues, and rules that the agent can ignore. The design effort is high, and someone must maintain the ontology.\n-\n  approach: prompt instructions only\n  how_it_answers: The agent reads raw table schemas plus text instructions that you write, for example 'sts X means cancelled'.\n  good_for: A quick test on a few tables with one agent.\n  risk: The instructions stay inside one agent and are not shared or governed. They grow long, use more input tokens, and do not track schema changes. The semantic gap stays."},{"i":"L5.decision_guide.use_now_when","l":5,"t":"L5 > decision_guide > use_now_when","x":"- The use is on the trial path from lesson 2 concept 5, for example an internal assistant for store managers with human review.\n- Many agents or teams need the same business vocabulary, and one agent's prompt instructions are not sufficient.\n- Questions combine concepts from several sources, for example lakehouse sales and eventhouse stock.\n- You have a GA fallback: a data agent on the 'Store Sales' semantic model.\n- You can measure CU use on a paid capacity of F8 or larger."},{"i":"L5.decision_guide.wait_when","l":5,"t":"L5 > decision_guide > wait_when","x":"- The answer goes to the board report or another production path with no GA fallback.\n- You need service principal access through MCP, or you depend on semantic model bindings for the data agent.\n- You need rules that the system enforces or that start actions directly from the ontology.\n- Your data uses Decimal types, external tables, or composite keys that you cannot change.\n- Your capacity is outside US or EU regions and policy does not allow cross-geo AI processing."},{"i":"L5.decision_guide.check_first","l":5,"t":"L5 > decision_guide > check_first","x":"- Examine the status of each Fabric IQ component on its Microsoft Learn page, and record the page date.\n- Read the ontology troubleshooting page and the Fabric known issues list for 'ontology'.\n- Run known-answer tests, for example net sales of CH01 = 2000.0, against the 'Daily Store Sales' report.\n- Measure the CU use of each meter in the Capacity Metrics app during a trial on a paid capacity.\n- Confirm that OneLake security roles and RLS give the correct rows to each store manager through the agent.\n- Choose the creator identity of each operations agent, because actions use its permissions.\n- Plan the migration from the old ontology experience before 2027-01-31."},{"i":"L5.check_questions.0","l":5,"t":"L5 > check_questions > 0","x":"question: Does an ontology rule stop a cancelled order from being counted in net sales?\nanswer: No. A rule is natural-language text. The ontology does not run it. The agent must read and follow it, so you must test the answers."},{"i":"L5.check_questions.1","l":5,"t":"L5 > check_questions > 1","x":"question: When a data agent uses an ontology, which part runs the query?\nanswer: The underlying source, for example the lakehouse. The ontology gives context only. The agent writes SQL, KQL, or DAX for one source."},{"i":"L5.check_questions.2","l":5,"t":"L5 > check_questions > 2","x":"question: Name three ways to create an ontology that Microsoft Learn verifies.\nanswer: Generate it from a Power BI semantic model, create it manually and bind it, or use the ontology agent. You can also import RDF, Turtle, or OWL."},{"i":"L5.check_questions.3","l":5,"t":"L5 > check_questions > 3","x":"question: What becomes of the DAX measure [Net Sales] when you generate an ontology from the semantic model?\nanswer: It becomes a metric on an entity type."},{"i":"L5.check_questions.4","l":5,"t":"L5 > check_questions > 4","x":"question: Which identity does an operations agent action use?\nanswer: The identity of the creator, in delegated mode, through the On-Behalf-Of flow. The agent also has its own Entra Agent ID for attribution."},{"i":"L5.check_questions.5","l":5,"t":"L5 > check_questions > 5","x":"question: Can a coding agent in VS Code change the ontology through the ontology MCP server?\nanswer: Microsoft Learn documents only read tools: list entity types, search the ontology, and list rules. It documents no write tools."},{"i":"L5.check_questions.6","l":5,"t":"L5 > check_questions > 6","x":"question: Does the operations agent cost CUs when no condition is true?\nanswer: Yes. After activation, its compute meter uses 0.46 CU-hours for each hour."},{"i":"L5.check_questions.7","l":5,"t":"L5 > check_questions > 7","x":"question: Is the data agent in the Data Science workload or in Fabric IQ?\nanswer: Both. Microsoft Learn lists it as a Fabric IQ item that is also in the Data Science workload."},{"i":"L5.status_note.p0","l":5,"t":"L5 > status_note","x":"Status of each component on 2026-11-07. Each line gives the source and the source date.\n- Fabric IQ workload: Preview. The Fabric IQ overview shows the name 'IQ (preview)' (updated 2026-09-29). The Foundry Fabric IQ tool is preview (2026-10-23). The Azure blog (2026-09-28) says that Fabric IQ in Copilot Chat and Cowork is GA, but it gives no GA status for the workload. Directions on Microsoft (2026-08-28, lesson 1) reports GA. I trust Microsoft Learn more, because it is the product documentation and has a later date.\n- Ontology: Preview (Ontology overview, updated 2026-10-16). Binding, generation, rules, ontology agent, capacity usage, and MCP pages all say preview (2026-09-29 to 2026-10-21). The old experience retires on 2027-01-31.\n- Ontology rules: Preview (2026-09-29). The new experience has no direct Activator integration. A Fabric blog post describes rules that start alerts and actions. That post describes the old experience or a future plan, and it disagrees with the Microsoft Learn page. I trust Microsoft Learn.\n- Ontology agent: Preview (2026-09-29).\n- Ontology MCP server: Preview (Microsoft Learn, updated 2026-10-01; Copilot Studio page, footer 2026-08-04, metadata 2026-10-20). A Fabric blog post calls MCP endpoints 'coming soon', which is older than the Microsoft Learn pages.\n- Graph: Unclear. The Graph overview gives no label for the core function, and marks graph-powered reasoning with a data agent as preview (2026-05-20). The Fabric IQ overview links to it with "},{"i":"L5.status_note.p1","l":5,"t":"L5 > status_note","x":"a preview label (2026-09-29). Directions on Microsoft reports GA in June 2026 (lesson 1).\n- Plan: Probably GA. The Plan overview says it is available worldwide as part of the Fabric SKU, with no preview label. The page dates disagree: ms.date 2026-07-28, footer 2026-08-31, metadata 2026-10-01.\n- Data agent: Mixed. The concept page says GA (2026-05-11). The Release status page says preview for 'Create a Fabric data agent' (2026-07-12). Ontology as a data agent source is preview, with an outage notice (2026-10-05). I treat the data agent on a semantic model or lakehouse as GA, and the data agent with an ontology as preview.\n- Data agent query language with an ontology: Sources disagree. The data agent ontology page (2026-10-05) documents SQL, KQL, and DAX and does not mention GQL. The troubleshooting page (2026-10-01) gives a GQL instruction for data agent aggregation. The ontology agent uses GQL when a graph model exists. I trust the data agent ontology page for the data agent, because it is the specific page, but this point is not settled.\n- Operations agent: Mixed. Release status page: GA (2026-07-12). Operations agent page: no label (2026-10-21). New functions such as pre-approved actions are preview (Azure blog, 2026-09-28). Ontology use for playbooks is 'coming soon' (Fabric blog, no date).\n- Power BI semantic model: GA. Its use as an ontology source is preview.\n- Work IQ: Not labeled (2026-11-05). Foundry IQ: Mixed (2026-11-06). Web IQ: Unclear, announced 2026-06-02 on t"},{"i":"L5.status_note.p2","l":5,"t":"L5 > status_note","x":"he Bing blog, with no Microsoft Learn page found.\n- Microsoft Learn pages often show two or three different dates (ms.date, footer, metadata). I give the 'last updated' date when I can.\nPreview status changes frequently. Examine the Microsoft Learn page for each component before you use it in production.\n"},{"i":"L5.course_summary.one_page_summary.p0","l":5,"t":"L5 > course_summary > one_page_summary","x":"FABRIC IQ COURSE MAP (retail company: 40 stores, 1 online shop, about 2,000 products)\n\nL1 VOCABULARY       27 terms: capacity, CU, F SKU, workload, workspace, item, OneLake,\n                    lakehouse, semantic model, preview vs GA, Fabric IQ, ontology,\n                    entity type, property, instance, relationship, binding, rule,\n                    Graph, Plan, data agent, operations agent, MCP, Work IQ,\n                    Foundry IQ, Microsoft IQ\n                           |\nL2 CHAINS           container chain:  capacity -> workspace -> item   (who pays, owns, sees)\n                    data chain:       POS -> pipeline -> OneLake -> Delta tables -> SQL\n                    meaning chain:    tables -> semantic model [Net Sales] -> reports\n                    decision rule:    production path = GA; preview = trial path + fallback\n                    semantic gap:     ord_hdr -> SUM(amt) = 3100 (wrong) vs 2000 (correct)\n                           |\nL3 WHOLE PLATFORM   9 workloads on 1 OneLake, 1 capacity model, 1 governance layer\n                    retail day: pipeline -> notebook -> lakehouse -> semantic model\n                                -> report -> eventstream -> Activator -> data agent\n                           |\nL4 PURPOSE          solves: many copies, many tools, many bills, many security models\n                    weak:   preview parts, shared capacity, cost, lock-in, learning curve\n                    check:  status, trial with CUs, licenses, region, owner"},{"i":"L5.course_summary.one_page_summary.p1","l":5,"t":"L5 > course_summary > one_page_summary","x":"s\n                           |\nL5 FABRIC IQ        OneLake -> semantic model -> ONTOLOGY (+ optional Graph)\n                    -> agents (data, operations, ontology, MCP) ; Plan on semantic models\n                    rules = text context, not enforcement ; bindings = pointers, need refresh\n                    status: ontology and MCP preview ; data agent mixed ; Plan probably GA\n                    use now: trial path with GA fallback ; wait: production with no fallback\n"},{"i":"L5.course_summary.key_takeaways","l":5,"t":"L5 > course_summary > key_takeaways","x":"- Fabric IQ is a workload that adds business meaning on top of OneLake and Power BI semantic models.\n- The ontology defines entity types, properties, relationships, rules, and metrics, and binds them to data without a copy.\n- Ontology rules are natural-language context. The ontology does not run them or start actions.\n- The data agent uses the ontology as context and queries one underlying source with the permissions of the user.\n- The operations agent monitors an eventhouse or an ontology every 5 minutes, and its actions use the permissions of the creator.\n- Graph is an optional execution layer for multihop questions, billed for uptime.\n- Plan builds budgets and forecasts on semantic models and writes results to a SQL database in Fabric.\n- The ontology MCP server gives read access to external agents, such as a coding agent in VS Code.\n- Fabric IQ, Work IQ, Foundry IQ, and Web IQ give data, work, document, and web context.\n- Every agent call uses CUs from the capacity, so measure cost in the Capacity Metrics app.\n- Most Fabric IQ components are preview, so keep the production path on GA parts with a fallback.\n- Test agent answers against known report numbers before you trust them."},{"i":"L5.course_summary.learning_path_after_course.0","l":5,"t":"L5 > course_summary > learning_path_after_course > 0","x":"step: Learn the Fabric IQ basics in a guided path\nresource_title: Get started with Fabric IQ (Microsoft Learn training path)\nurl: https://learn.microsoft.com/training/paths/get-started-fabric-iq"},{"i":"L5.course_summary.learning_path_after_course.1","l":5,"t":"L5 > course_summary > learning_path_after_course > 1","x":"step: Read the ontology concepts again with the retail sketch in mind\nresource_title: Ontology overview (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/iq/ontology/overview"},{"i":"L5.course_summary.learning_path_after_course.2","l":5,"t":"L5 > course_summary > learning_path_after_course > 2","x":"step: Generate a first ontology from your semantic model\nresource_title: Generate an ontology from a semantic model (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/iq/ontology/concepts-generate"},{"i":"L5.course_summary.learning_path_after_course.3","l":5,"t":"L5 > course_summary > learning_path_after_course > 3","x":"step: Bind lakehouse and eventhouse data\nresource_title: Data binding in ontology (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/iq/ontology/how-to-bind-data"},{"i":"L5.course_summary.learning_path_after_course.4","l":5,"t":"L5 > course_summary > learning_path_after_course > 4","x":"step: Write business rules\nresource_title: Create and manage business rules in ontology (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/iq/ontology/how-to-use-rules"},{"i":"L5.course_summary.learning_path_after_course.5","l":5,"t":"L5 > course_summary > learning_path_after_course > 5","x":"step: Use the ontology agent in Plan mode, then Act mode\nresource_title: How to use the ontology agent (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/iq/ontology/how-to-use-ontology-agent"},{"i":"L5.course_summary.learning_path_after_course.6","l":5,"t":"L5 > course_summary > learning_path_after_course > 6","x":"step: Connect a data agent to the ontology\nresource_title: Use Ontology as context in Fabric data agent (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/data-science/data-agent-ontology-sources"},{"i":"L5.course_summary.learning_path_after_course.7","l":5,"t":"L5 > course_summary > learning_path_after_course > 7","x":"step: Set up an operations agent for low stock\nresource_title: Operations agent in Real-Time Intelligence (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/real-time-intelligence/operations-agent"},{"i":"L5.course_summary.learning_path_after_course.8","l":5,"t":"L5 > course_summary > learning_path_after_course > 8","x":"step: Connect VS Code to the ontology MCP server\nresource_title: Use the ontology MCP server (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/iq/ontology/how-to-use-ontology-mcp-server"},{"i":"L5.course_summary.learning_path_after_course.9","l":5,"t":"L5 > course_summary > learning_path_after_course > 9","x":"step: Measure cost before you scale\nresource_title: Ontology capacity usage (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/iq/ontology/resources-capacity-usage"},{"i":"L5.course_summary.learning_path_after_course.10","l":5,"t":"L5 > course_summary > learning_path_after_course > 10","x":"step: Read the known issues before each release\nresource_title: Ontology troubleshooting (Microsoft Learn)\nurl: https://learn.microsoft.com/en-us/fabric/iq/ontology/resources-troubleshooting"},{"i":"L5.summary_bullets","l":5,"t":"L5 > summary_bullets","x":"- Fabric IQ adds an ontology on top of OneLake and the semantic model to close the semantic gap.\n- Bindings point to data in place. Rules are text for agents, not enforcement.\n- The data agent queries one underlying source with the user's permissions, and the ontology gives context.\n- The operations agent monitors data every 5 minutes and acts with the creator's permissions.\n- The ontology MCP server gives external agents read access, in preview.\n- Each component uses CUs, with separate meters for the ontology, Graph, the data agent, and the operations agent.\n- Use Fabric IQ now on the trial path with a GA fallback, and wait for GA for production paths."}];
/* Vectorless retrieval: keyword scoring (BM25) over the embedded lesson YAML chunks. No embeddings. */
const STOP=new Set('a an the of to in on for and or is are be as at by it its this that with from you your we our not no do does can will if then than so what how when which who why into out up'.split(' '));
const tok=t=>(String(t).toLowerCase().match(/[a-z0-9_]+/g)||[]).filter(w=>!STOP.has(w)&&w.length>1);
const IDX=(()=>{const df={};let tl=0;const rows=DOCS.map(d=>{const tt=tok(d.t),tx=tok(d.x);const all=tt.concat(tt,tt,tx);const tf={};all.forEach(w=>tf[w]=(tf[w]||0)+1);Object.keys(tf).forEach(w=>df[w]=(df[w]||0)+1);tl+=all.length;return{d,tf,len:all.length}});return{rows,df,avg:tl/rows.length,n:rows.length}})();
function search(q,filter,k){
  const qs=Array.from(new Set(tok(q)));const out=[];
  IDX.rows.forEach(r=>{if(filter&&!filter(r.d))return;let sc=0;
    qs.forEach(w=>{const f=r.tf[w];if(!f)return;const idf=Math.log(1+(IDX.n-IDX.df[w]+.5)/(IDX.df[w]+.5));sc+=idf*f*2.4/(f+1.4*(.25+.75*r.len/IDX.avg))});
    if(sc>0)out.push([sc,r.d])});
  return out.sort((a,b)=>b[0]-a[0]).slice(0,k).map(x=>x[1]);
}
function retrieve(q,budget){
  const picks=[],seen=new Set();let used=0;
  const add=d=>{if(!d||seen.has(d.i)||used+d.x.length>budget)return;seen.add(d.i);picks.push(d);used+=d.x.length};
  search(q,d=>/corrections/.test(d.i),1).forEach(add);
  search(q,null,10).forEach(add);
  return picks;
}
const ctxText=ch=>ch.map(d=>`[${d.i} | ${d.t}]\n${d.x}`).join('\n\n');

const RULES=`You are the teacher inside a guided course called Fabric IQ Quest. The learner is a software engineer who starts with zero knowledge of Microsoft Fabric and Fabric IQ. The page is only the interface. YOU run the whole lesson: you warm up, teach, set tasks, grade, check transfer, and write the recap. You must understand what you teach and what this learner already knows.
Style: simple technical English. Short sentences, one idea per sentence, active voice, no idioms. Casual tone. Code first, then a short explanation. Use before/after when it helps. Short bullets. Use the retail story (40 stores, an online shop, store CH01, table ord_hdr).
Learning cycle (every concept is seen more than once): see (teach with example) -> try (learner answers) -> check (you grade) -> transfer (a new variation of the same skill) -> recap -> later recall (a warm-up question in a later mission). Always connect new ideas to what the learner already learned (see LEARNER STATE) and adapt to their recent mistakes.
Grounding: each message has a CONTEXT block of chunks from the five lesson YAML files, with ids like [L2.concepts.3]. Teach and answer ONLY from CONTEXT, the REFERENCE and LEARNER STATE. Before you write, check that every fact you state is in them. If a fact is missing, say you are not sure. If chunks conflict, prefer the lesson 5 corrections chunk, then the later lesson. Preview and GA status is as of 2026-11-07. In "used", list the chunk ids you really used.
Modes:
- RECALL: ask ONE short memory question on an earlier mission (put it in "task"), and if asked, link it to today's mission in one sentence. No answer.
- RECALL_GRADE: grade the recall answer against the REFERENCE. Give verdict with feedback and correct_version. Short.
- TEACH: worked example first (code or small text diagram), then 3-5 bullets, then the task in "task". Link to earlier learned ideas. Do not give the REFERENCE answer.
- GRADE: judge the answer against the REFERENCE. result = "correct", "partial" or "wrong". Always give feedback and correct_version. If not correct, say what to fix.
- HELP: give a hint or a different explanation. Do not reveal the full REFERENCE unless the learner asks. If the learner asks to see it, put it in correct_version with result "shown".
- TRANSFER: give ONE new variation of the same skill (different names or numbers, same difficulty) in "task", and the private correct answer in "expected". Never reveal "expected".
- TRANSFER_GRADE: grade against the private expected answer with the same verdict format.
- RECAP: write a recap in "say" (max 80 words): 3 bullets of what they now know, 1 bullet on their weak point from RECENT ATTEMPTS, 1 bullet linking to the next mission.
- ASK: answer a free question from CONTEXT. No task, no verdict.
Reply with ONLY one JSON object: {"say": string (max 150 words; may use "- " bullets, \`code\` and fenced blocks), "task": string or null, "expected": string or null, "verdict": null or {"result": "correct"|"partial"|"wrong"|"shown", "feedback": string, "correct_version": string}, "used": [chunk ids]}.`;

function md(t){
  const parts=String(t).split(/```[a-z]*\n?/);let out='';

    if(k%2){out+=`<pre class="code" style="margin:8px 0">${esc(p.replace(/\n$/,''))}</pre>`;return}
    let inl=false;
    esc(p).split('\n').forEach(l=>{const m=/^\s*[-*]\s+(.*)/.exec(l);const f=x=>x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');

    if(inl)out+='</ul>';
  });
  return out;
}

async function callTeacher(mode,shortText,body,query,label){
  if(!canAsk()||tutor.busy)return null;const x=cs();
  const ch=retrieve(query,9000);
  const full=`${body}\n\n${learnerCtx()}\n\nCONTEXT (retrieved from the course YAML):\n${ctxText(ch)}`;
  x.turns.push({role:'user',content:`MODE ${mode}: ${shortText}`});
  const hist=x.turns.slice(0,-1).slice(-10);   /* previous turns of this mission/review go to the model every call */
  while(hist.length&&hist[0].role!=='user')hist.shift();
  tutor.busy=true;tutor.ctl=new AbortController();drawChat();
  try{
    const r=await askJSON([{role:'user',content:RULES},...hist,{role:'user',content:full}],tutor.ctl.signal);
    if(!r||typeof r.say!=='string')throw{code:'invalid_json'};
    x.turns.push({role:'assistant',content:JSON.stringify({say:r.say,task:r.task||null,verdict:r.verdict&&r.verdict.feedback?{result:r.verdict.result,feedback:String(r.verdict.feedback).slice(0,400)}:null})});
    const byId={};ch.forEach(d=>byId[d.i]=d);
    let used=(Array.isArray(r.used)?r.used:[]).filter(i=>byId[i]).map(i=>byId[i]);
    if(!used.length)used=ch.slice(0,3);
    x.log.push({k:'ai',t:r.say,u:used});
    if(label&&typeof r.task==='string'&&r.task)x.log.push({k:'task',lab:label,t:r.task});
    tutor.busy=false;tutor.ctl=null;return r;
  }catch(e){
    x.turns.pop();
    if(!e||e.code!=='cancelled')x.log.push({k:'err',t:TERR[e&&e.code]||'Something went wrong. Try again.'});
    tutor.busy=false;tutor.ctl=null;return null;
  }
}

function missionBody(mode,extra){
  const m=MISSIONS[mIdx()];
  return `MODE: ${mode}\nCURRENT MISSION ${mIdx()+1} of ${MISSIONS.length}: ${m.t}\nGoal: ${m.goal}\nTask: ${m.task}\nREFERENCE (correct, for grading; do not reveal in TEACH): ${m.ref}\nConcept ids: ${m.c.join(', ')}\n${extra||''}`;
}
function missionQuery(extra){const m=MISSIONS[mIdx()];return `${m.t} ${m.goal} ${m.c.map(i=>C[i].name).join(' ')} ${extra||''}`}
async function doRecall(){
  const x=cs(),today=isRev()?null:mIdx(),rm=pickRecall(today);
  if(rm===null){if(isRev()){x.log.push({k:'ai',t:'Finish a mission first. Then I can review it with you.'});renderTutor();return}return doTeach()}
  x.rm=rm;
  const body=`MODE: RECALL\nAsk ONE short recall question on the earlier mission below. Test memory and understanding, not copying. ${today!==null?"Then link it to today's mission in one sentence: "+MISSIONS[today].t+'.':''} Put the question in "task". Do not give the answer.\n${missionRef(rm)}`;
  const r=await callTeacher('RECALL','warm-up on mission '+(rm+1),body,MISSIONS[rm].t+' '+MISSIONS[rm].c.map(i=>C[i].name).join(' '),'Warm-up recall');
  if(r){x.stage='recall';x.lastTask=r.task||''}else x.stage='start';
  renderTutor();
}
async function doTeach(){
  const x=cs(),mi=mIdx();
  const r=await callTeacher('TEACH','start the mission',missionBody('TEACH',"Link to the 'Already learned' list where it fits."),missionQuery(),'Your task');
  if(r){if(!r.task)x.log.push({k:'task',lab:'Your task',t:MISSIONS[mi].task});x.lastTask=r.task||MISSIONS[mi].task;x.stage='try'}
  else x.stage=x.stage==='recall_done'?'recall_done':'start';
  renderTutor();
}
async function doTransfer(){
  const x=cs(),mi=mIdx();
  const r=await callTeacher('TRANSFER','new variation',missionBody('TRANSFER','The learner solved the task. Give ONE new variation of the same skill (different names or numbers, same difficulty). Put it in "task". Put the private correct answer in "expected".'),missionQuery('variation'),'New variation');
  if(r&&r.task){x.lastTask=r.task;x.expected=String(r.expected||'');x.stage='transfer'}
  renderTutor();
}
async function doSubmit(){
  const ta=$('#tans'),v=((ta&&ta.value)||'').trim();if(!v||tutor.busy)return;
  const x=cs(),st=x.stage,mi=isRev()?null:mIdx();x.log.push({k:'me',t:v});
  if(st==='recall'){
    const r=await callTeacher('RECALL_GRADE','recall answer: '+v.slice(0,400),`MODE: RECALL_GRADE\n${missionRef(x.rm)}\nQuestion asked: ${x.lastTask}\nLearner answer:\n${v}`,MISSIONS[x.rm].t+' '+v,null);
    if(r&&r.verdict&&r.verdict.feedback){vlog(r.verdict,MISSIONS[x.rm].ref);gainOn(x.rm,{correct:.3,partial:.15,wrong:-1,shown:.05}[r.verdict.result]||0);if(r.verdict.result==='correct')S.xp+=10;rec(x.rm,'recall',r.verdict.result,v);save();x.stage='recall_done'}
  }else if(st==='try'){
    const r=await callTeacher('GRADE','answer: '+v.slice(0,600),missionBody('GRADE','Learner answer:\n'+v),missionQuery(v),null);
    if(r&&r.verdict&&r.verdict.feedback){const res=r.verdict.result;vlog(r.verdict,MISSIONS[mi].ref);gainOn(mi,{correct:.35,partial:.15,wrong:-1,shown:.1}[res]||0);rec(mi,'try',res,v);
      if(res==='correct'){S.xp+=25;S.streak++;x.stage='transfer_ready'}else if(res==='wrong')S.streak=0;
      S.best=Math.max(S.best||0,S.streak);save()}
  }else if(st==='transfer'){
    const r=await callTeacher('TRANSFER_GRADE','variation answer: '+v.slice(0,600),`MODE: TRANSFER_GRADE\nMISSION ${mi+1}: ${MISSIONS[mi].t}\nVariation given: ${x.lastTask}\nPRIVATE EXPECTED ANSWER: ${x.expected||'(none: work it out from CONTEXT)'}\nLearner answer:\n${v}`,missionQuery(v),null);
    if(r&&r.verdict&&r.verdict.feedback){const res=r.verdict.result;vlog(r.verdict,x.expected);gainOn(mi,{correct:.3,partial:.15,wrong:-1,shown:.05}[res]||0);rec(mi,'transfer',res,v);
      if(res==='correct'||res==='partial'){if(res==='correct')S.xp+=15;finishMission(mi);x.stage='finished'}else S.streak=0;
      save()}
  }
  renderTutor();
}
async function doHelp(kind){
  const x=cs(),st=x.stage,mi=isRev()?null:mIdx();if(tutor.busy)return;
  const ask={hint:'The learner asks for a hint. Give a hint only.',conf:'The learner is confused. Explain the idea a different way, with a small code or before/after example.',show:'The learner asks to see the answer. Show it in correct_version with result "shown".'}[kind];
  const short={hint:'asks for a hint',conf:'is confused',show:'asks to see the answer'}[kind];
  const body=st==='transfer'?`MODE: HELP\nMISSION ${mi+1}: ${MISSIONS[mi].t}\nVariation given: ${x.lastTask}\nPRIVATE EXPECTED ANSWER: ${x.expected||'(none)'}\n${ask}`:missionBody('HELP',ask);
  const r=await callTeacher('HELP',short,body,missionQuery(kind==='conf'?'explain simply example':''),null);
  if(r&&kind==='show'&&r.verdict&&r.verdict.feedback){
    vlog(r.verdict,st==='transfer'?x.expected:MISSIONS[mi].ref);rec(mi,st,'shown','');
    if(st==='transfer'){gainOn(mi,.05);finishMission(mi);x.stage='finished'}else{gainOn(mi,.1);x.stage='transfer_ready'}
    save();
  }
  renderTutor();
}
async function doRecap(){
  const x=cs(),mi=mIdx();
  const r=await callTeacher('RECAP','write my recap',missionBody('RECAP','Write the recap now.'),missionQuery('recap summary'),null);
  if(r){S.notes[mi]=r.say;save()}
  renderTutor();
}
async function askFree(text){const x=cs();x.log.push({k:'me',t:text});drawChat();await callTeacher('ASK',text,`MODE: ASK\nQUESTION: ${text}`,text,null);renderTutor()}
function pickMission(k){if(tutor.busy)return;tutor.key=k;renderTutor()}

/* ----- events ----- */
let resetArmed=false;
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='nb'){intro=true;try{localStorage.removeItem('fiq-intro')}catch(e){}renderBoard();return}
  if(t.id==='nc'){renderCodex();return}
  if(t.id==='hideintro'){intro=false;try{localStorage.setItem('fiq-intro','0')}catch(e){}renderBoard();return}
  if(t.id==='nt'){renderTutor();return}
  if(t.id==='csave'){CFG.provider=$('#cprov').value;CFG.model=$('#cmodel').value.trim()||CFG.model;CFG.key=$('#ckey').value.trim();CFG.remember=!!($('#cremember')&&$('#cremember').checked);CFG.proxy=$('#cproxy').value.trim();CFG.pin=+$('#cpin').value||0;CFG.pout=+$('#cpout').value||0;CFG.tokLimit=Math.max(0,Math.floor(+$('#ctok').value||0));if(CFG.provider==='openrouter'&&!CFG.model.includes('/'))CFG.model=DEF_OR_MODEL;if(CFG.provider==='gemini'&&CFG.model.includes('/'))CFG.model=DEF_GEM_MODEL;saveCfg();renderTutor();return}
  if(t.dataset.mi){pickMission(t.dataset.mi);return}
  if(t.dataset.askterm){const tm=REF.T.find(z=>z.id==+t.dataset.askterm);if(!canAsk()||!tm)return;tutor.key='free';view='tutor';renderTutor();askFree('Explain "'+tm.term+'" to me with a small code example.');return}
  if(t.id==='tstart'){const x=cs();x.log=[];x.turns=[];x.stage='start';if(isRev()||pickRecall(mIdx())!==null)doRecall();else doTeach();return}
  if(t.id==='tteach'){doTeach();return}
  if(t.id==='tskip'){doTeach();return}
  if(t.id==='ttransfer'){doTransfer();return}
  if(t.id==='trecap'){doRecap();return}
  if(t.id==='tnext'){pickMission('m'+(mIdx()+1));return}
  if(t.id==='tsub'){doSubmit();return}
  if(t.id==='thint'){doHelp('hint');return}
  if(t.id==='tconf'){doHelp('conf');return}
  if(t.id==='tshow'){doHelp('show');return}
  if(t.id==='tasend'){const i=$('#tin');if(i&&i.value.trim()){const v=i.value;i.value='';askFree(v)}return}
  if(t.id==='tstop'){if(tutor.ctl)tutor.ctl.abort();return}
  if(t.id==='nj'){renderJargon();return}
  if(t.dataset.jtab){jtab=t.dataset.jtab;renderJargon();return}
  if(t.dataset.jcat){jcat=t.dataset.jcat;renderJargon();return}
  if(t.dataset.jo){jopen[t.dataset.jo]=!jopen[t.dataset.jo];renderJargon();return}
  if(t.dataset.jgo){jtab='terms';jq='';jcat='all';jopen['t'+t.dataset.jgo]=true;renderJargon();return}
  if(t.id==='theme'){const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'light':'dark';return}
  if(t.dataset.block){showBlock(t.dataset.block);return}
  if(t.dataset.zone){startZone(+t.dataset.zone);return}
  if(t.id==='rev'){startReview(ids.filter(k=>S.done[k]&&mast(k)<.75),5);return}
  if(t.id==='build'){ask(sess.cid,'');return}
  if(t.id==='know'){ask(sess.cid,'probe');return}
  if(t.id==='next'){advance();return}
  if(t.id==='after'){sess.i++;nextConcept(false);return}
  if(t.id==='home'){renderBoard();return}
  if(t.id==='reset'){
    if(!resetArmed){resetArmed=true;t.textContent='Click again to erase all progress';return}
    resetArmed=false;S={xp:0,streak:0,best:0,m:{},seen:{},done:{},miss:{}};save();renderBoard();
  }
});
renderBoard();
</script>
