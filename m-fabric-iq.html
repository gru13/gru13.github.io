\nworkload: Power BI\nitem_type: Report\naction: At 08:00, the report 'Daily Store Sales' shows [Net Sales] for each of the 40 stores.\noutput: The same numbers for the sales team and the finance team."},{"i":"L3.end_to_end_flow.steps.6","l":3,"t":"L3 > end_to_end_flow > steps > Real-Time Intelligence","x":"step: 7\nworkload: Real-Time Intelligence\nitem_type: Eventstream and Eventhouse\naction: During the day, an eventstream receives stock events from the stores and writes them to an eventhouse.\noutput: Stock levels for each product and store that are a few seconds old."},{"i":"L3.end_to_end_flow.steps.7","l":3,"t":"L3 > end_to_end_flow > steps > Real-Time Intelligence","x":"step: 8\nworkload: Real-Time Intelligence\nitem_type: Activator\naction: An Activator rule checks the stock events and sends a Microsoft Teams message when a product has fewer than 10 units in a store.\noutput: An alert to the store manager of the store 'Chennai Main Road'."},{"i":"L3.end_to_end_flow.steps.8","l":3,"t":"L3 > end_to_end_flow > steps > Data Science (data agent; the Fabric overview also lists the data agent under Fabric IQ)","x":"step: 9\nworkload: Data Science (data agent; the Fabric overview also lists the data agent under Fabric IQ)\nitem_type: Data agent\naction: The store manager asks: 'Which products in my store had low stock this week, and what were their net sales?'\noutput: A natural-language answer that uses the semantic model and the user's permissions."},{"i":"L3.end_to_end_flow.ascii_diagram","l":3,"t":"L3 > end_to_end_flow > ascii_diagram","x":"POS database (outside Fabric)\n      |\n      | [1] Data Factory: pipeline (01:00)\n      v\n+-------------------------- OneLake ---------------------------+\n|  'SalesLakehouse' (Data Engineering: lakehouse)              |\n|    Files/raw_orders                                          |\n|        | [2] Data Engineering: notebook (Spark, 01:30)       |\n|        v                                                     |\n|    Tables: orders, products, stores, customers (Delta) [3]   |\n+----------|-------------------|------------------|------------+\n           |                   |                  |\n[4] Data Warehouse:   [5] Power BI:          [9] data agent\n    SQL analytics         semantic model         (question in\n    endpoint (T-SQL)      [Net Sales]            natural language)\n    -> monthly margin        |                        ^\n                             v                        |\n                      [6] Power BI: report    uses the semantic model\n                          'Daily Store Sales'\n\nStore stock events (outside Fabric)\n      |\n      | [7] Real-Time Intelligence: eventstream -> eventhouse\n      v\n[8] Real-Time Intelligence: Activator rule (stock < 10)\n      -> Microsoft Teams message to the store manager\n"},{"i":"L3.saas_model","l":3,"t":"L3 > saas_model","x":"what_microsoft_manages:\n  - The servers, the storage hardware, and the networks below Fabric.\n  - The Spark, SQL, KQL, and Power BI engines, and their software updates.\n  - The Azure resource groups, Azure Resource Manager, redundancy, and regions below the service. Microsoft Learn says that users do not manage them.\n  - The start of compute for a job. The customer does not create a Spark cluster or a SQL server.\n  - The background compute for mirroring. It does not use the customer capacity.\nwhat_the_customer_manages:\n  - The choice and the size of the capacity, for example F64, and when to pause it or make it larger.\n  - The per-user licenses, for example Pro licenses for report readers on capacities smaller than F64.\n  - The tenant settings, the domains, and the workspaces.\n  - Access: workspace roles, item permissions, and OneLake security roles.\n  - The data, the items, and the business logic, for example the measure [Net Sales].\n  - The source systems, the connections to them, and gateways for sources on premises.\n  - The cost: the capacity use, and OneLake storage above the free limits.\ncommon_mistake: Do not think that SaaS means 'no administration'. Microsoft manages the infrastructure, but the customer must still size the capacity, set access, and watch the capacity use."},{"i":"L3.inside_and_outside_fabric.stays_outside","l":3,"t":"L3 > inside_and_outside_fabric > stays_outside","x":"- The source systems, for example the POS database, the enterprise resource planning (ERP) system, and the loyalty program application.\n- External data stores, for example Amazon S3, Google Cloud Storage, and ADLS Gen2 accounts.\n- External engines and platforms, for example Azure Databricks, Snowflake, and Google BigQuery.\n- Microsoft 365 data such as mail and chats (Work IQ), and documents for Foundry IQ.\n- AI agents and applications that run outside Fabric, for example a coding agent in VS Code."},{"i":"L3.inside_and_outside_fabric.connection_methods.0","l":3,"t":"L3 > inside_and_outside_fabric > connection_methods > 0","x":"method: Connectors (Data Factory)\nwhat_it_does: Pipelines, Dataflow Gen2, and copy jobs use more than 200 native connectors to copy data from a source into OneLake on a schedule.\nstatus: GA (Microsoft Fabric overview, footer 2026-03-31)."},{"i":"L3.inside_and_outside_fabric.connection_methods.1","l":3,"t":"L3 > inside_and_outside_fabric > connection_methods > 1","x":"method: OneLake shortcuts\nwhat_it_does: A shortcut points to data in another location, for example ADLS, Amazon S3, or Google Cloud Storage. The data stays in its source, and Fabric makes no copy.\nstatus: GA (OneLake shortcuts page, footer 2026-07-13)."},{"i":"L3.inside_and_outside_fabric.connection_methods.2","l":3,"t":"L3 > inside_and_outside_fabric > connection_methods > 2","x":"method: Database mirroring\nwhat_it_does: Mirroring copies a source database continuously into OneLake as Delta tables, with no pipeline. Example sources are Azure SQL Database, SQL Server, Oracle, SAP, Snowflake, and Google BigQuery.\nstatus: Mixed. Most sources have no preview label. Azure Database for MySQL and SharePoint List are preview, and Google BigQuery is GA (Mirroring overview, 2026-08-28)."},{"i":"L3.inside_and_outside_fabric.connection_methods.3","l":3,"t":"L3 > inside_and_outside_fabric > connection_methods > 3","x":"method: Metadata mirroring\nwhat_it_does: Metadata mirroring copies only the catalog, the schemas, and the table list, and it uses shortcuts so that the data stays in the source. Examples are Azure Databricks and Snowflake.\nstatus: Mixed. The Dremio catalog source is preview (Mirroring overview, 2026-08-28)."},{"i":"L3.inside_and_outside_fabric.connection_methods.4","l":3,"t":"L3 > inside_and_outside_fabric > connection_methods > 4","x":"method: Open mirroring\nwhat_it_does: Any application can write its change data into a landing zone in Delta Lake format with public APIs, and Fabric keeps a mirrored database current.\nstatus: No preview label (Mirroring overview, 2026-08-28)."},{"i":"L3.inside_and_outside_fabric.connection_methods.5","l":3,"t":"L3 > inside_and_outside_fabric > connection_methods > 5","x":"method: External data sharing\nwhat_it_does: A Fabric tenant can share governed data with another tenant, and the other tenant reads the data in place.\nstatus: No preview label on the Microsoft Fabric overview (footer 2026-03-31). I did not examine the detailed page."},{"i":"L3.inside_and_outside_fabric.connection_methods.6","l":3,"t":"L3 > inside_and_outside_fabric > connection_methods > 6","x":"method: Open formats and APIs\nwhat_it_does: OneLake keeps tables in the open Delta Lake format and supports ADLS-compatible APIs, so external tools can read OneLake data.\nstatus: GA (OneLake overview, footer 2026-08-23)."},{"i":"L3.fabric_iq_pointer","l":3,"t":"L3 > fabric_iq_pointer","x":"Fabric IQ is one of the Fabric workloads, and it is in preview. It sits above OneLake and the Power BI semantic models, and adds the ontology, Plan, Graph, the data agent, and the operations agent. In the retail flow, it changes step 9: the data agent uses the ontology concepts Customer, Order, Product, and Store. Lesson 5 teaches Fabric IQ in full."},{"i":"L3.whole_platform_ascii_diagram.p0","l":3,"t":"L3 > whole_platform_ascii_diagram","x":"WHO:   data engineer | analyst | data scientist | ops analyst | business user | app developer | admin\n+----------------------------------------------------------------------------------------------+\n|                                        WORKLOADS                                             |\n| +------------+ +-------------+ +-----------+ +-----------+ +-------------+ +-----------+     |\n| |Data Factory| |Data         | |Data       | |Data       | |Real-Time    | |Databases  |     |\n| |pipeline    | |Engineering  | |Warehouse  | |Science    | |Intelligence | |SQL db     |     |\n| |Dataflow G2 | |lakehouse    | |warehouse  | |experiment | |eventstream  | |Cosmos DB  |     |\n| |copy job    | |notebook     | |SQL endpt  | |model      | |eventhouse   | |mirrored db|     |\n| +------------+ +-------------+ +-----------+ |data agent | |Activator    | +-----------+     |\n|                                              +-----------+ +-------------+                   |\n| +------------------+ +---------------------------------------+ +---------------------+      |\n| |Power BI          | |Fabric IQ (preview)                    | |Industry Solutions   |      |\n| |semantic model    | |ontology, Plan, Graph,                 | |                     |      |\n| |report, dashboard | |data agent, operations agent           | |                     |      |\n| +------------------+ +---------------------------------------+ +---------------------+      |\n+--------------------------------------------"},{"i":"L3.whole_platform_ascii_diagram.p1","l":3,"t":"L3 > whole_platform_ascii_diagram","x":"--------------------------------------------------+\n|  SHARED FOUNDATION                                                                           |\n|  Copilot and AI features (in each workload)                                                  |\n|  Governance: OneLake catalog, domains, Microsoft Purview (labels, DLP, audit), OneLake security|\n|  Monitoring: Monitoring hub, Capacity Metrics app | Admin portal and tenant settings          |\n|  Containers: tenant -> capacity (F SKU, CUs) -> workspace -> item                             |\n+----------------------------------------------------------------------------------------------+\n|  OneLake: one data lake for each tenant, Delta Lake format, built on ADLS Gen2                |\n+----------------------------------------------------------------------------------------------+\n      ^ connectors (copy)        ^ shortcuts (no copy)          ^ mirroring (continuous copy)\nOUTSIDE FABRIC: POS database, ERP, Amazon S3, Google Cloud Storage, Snowflake, Azure Databricks, Oracle, SAP\n"},{"i":"L3.check_questions.0","l":3,"t":"L3 > check_questions > 0","x":"question: Which workload supplies the lakehouse item, and which workload supplies the pipeline item?\nanswer: Data Engineering supplies the lakehouse. Data Factory supplies the pipeline."},{"i":"L3.check_questions.1","l":3,"t":"L3 > check_questions > 1","x":"question: The retail company wants a Teams message when the stock of a product falls below 10 units. Which workload and which item do this?\nanswer: Real-Time Intelligence does this. An eventstream receives the stock events, and an Activator rule sends the message."},{"i":"L3.check_questions.2","l":3,"t":"L3 > check_questions > 2","x":"question: What is the difference between a OneLake shortcut and database mirroring?\nanswer: A shortcut points to data and makes no copy. Mirroring copies a source database continuously into OneLake as Delta tables."},{"i":"L3.check_questions.3","l":3,"t":"L3 > check_questions > 3","x":"question: The company uses an F32 capacity. Can a store manager with only a Free license read the 'Daily Store Sales' report?\nanswer: No. On a capacity smaller than F64, a person who views Power BI content needs a Pro, PPU, or trial license."},{"i":"L3.check_questions.4","l":3,"t":"L3 > check_questions > 4","x":"question: Fabric is SaaS. Does the customer still need an administrator?\nanswer: Yes. Microsoft manages the infrastructure and the engines. The customer must still size the capacity, set tenant settings, give access, and watch the capacity use."},{"i":"L3.check_questions.5","l":3,"t":"L3 > check_questions > 5","x":"question: Can the retail company use Copilot on the 60-day trial capacity?\nanswer: No. Copilot needs a paid F2 or larger capacity or a P capacity. It is not available on trial SKUs."},{"i":"L3.check_questions.6","l":3,"t":"L3 > check_questions > 6","x":"question: Which tool shows that a finance notebook uses most of the compute of the 'Retail-F64' capacity?\nanswer: The Capacity Metrics app shows the compute use for each workspace and item."},{"i":"L3.check_questions.7","l":3,"t":"L3 > check_questions > 7","x":"question: Is Fabric IQ a separate product outside Fabric?\nanswer: No. Fabric IQ is a workload inside Fabric, and it is in preview on Microsoft Learn."},{"i":"L3.status_note.p0","l":3,"t":"L3 > status_note","x":"Status of each component on 2026-11-07. Each line gives the source and the source date.\n- Fabric overview: The page gives no preview label for Power BI, Databases, Data Factory, Industry Solutions, Real-Time Intelligence, Data Engineering, Data Science, and Data Warehouse. It labels Fabric IQ as preview. The dates on the page disagree: footer 2026-03-31, metadata 2026-09-29.\n- Fabric terminology page: footer 2026-07-08, metadata 2026-08-31. It labels the workload 'IQ (preview)' and the ontology as preview, and gives no label for Plan.\n- Data Factory, Data Engineering, Data Warehouse, Data Science, Power BI: GA for the workloads. Some Copilot functions in each workload are preview (Copilot feature state page, 2026-07-12).\n- Real-Time Intelligence: GA for the main items (overview, footer 2026-05-20). Digital twin builder is preview. The anomaly detector and event schema set links have preview labels on the terminology page. Rules on ontology entities for alerts are preview.\n- Databases (SQL database in Fabric, Cosmos DB in Fabric): The Microsoft Learn overview pages give neither a preview label nor a GA label (SQL database overview 2026-10-02; Cosmos DB overview 2025-11-18). A Microsoft Fabric blog post from November 2025 announces GA. I treat them as GA, but I did not find a GA label on Microsoft Learn. The Database Hub is preview.\n- Data agent: Sources disagree. The data agent concept page (2026-05-11, see Lesson 1) gives no preview label. The Copilot and AI feature state pag"},{"i":"L3.status_note.p1","l":3,"t":"L3 > status_note","x":"e (2026-07-12) lists 'Create a Fabric data agent' as preview. The Fabric overview lists the data agent under Fabric IQ, which is preview.\n- Operations agent: The Copilot feature state page (2026-07-12) lists 'Get started with operations agent' as GA. Lesson 1 found no status on its own page.\n- Fabric IQ: Preview on Microsoft Learn (updated 2026-09-29). One analyst source reports GA in September 2026 (see Lesson 1).\n- Industry Solutions: Unclear. Listed with no label, but with no detail on the terminology page.\n- OneLake and shortcuts: GA (see Lesson 2).\n- OneLake security: No label (page footer 2026-09-01). Enforcement in third-party engines is preview.\n- OneLake catalog, domains, Monitoring hub, Capacity Metrics app, Admin portal: no preview label (governance overview, 2026-09-29). Purview live view is preview. Purview functions need additional Purview licenses.\n- Copilot: Needs a paid F2 or larger capacity or a P capacity, and is not on trial SKUs (Copilot overview, 2026-09-04). The status changes for each function. The feature state page has rows with a 'preview' name and a 'GA' status, for example Copilot for KQL queries, so the page disagrees with itself.\n- Mirroring: Mixed (Mirroring overview, 2026-08-28). MySQL, SharePoint List, and Dremio sources are preview. Google BigQuery is GA. Other sources have no label on the overview page.\n- Licenses: F SKUs are recommended, and P SKUs are retiring (licenses page, footer 2026-08-05).\n- Lesson 4 covers strengths and weak points"},{"i":"L3.status_note.p2","l":3,"t":"L3 > status_note","x":". This lesson does not judge them.\nPreview status changes frequently. Examine the Microsoft Learn page for each component before you use it in production.\n"},{"i":"L3.summary_bullets","l":3,"t":"L3 > summary_bullets","x":"- Fabric has nine workloads: Data Factory, Data Engineering, Data Warehouse, Data Science, Real-Time Intelligence, Databases, Power BI, Fabric IQ, and Industry Solutions.\n- All workloads store and read data in one OneLake for each tenant, in the Delta Lake format.\n- One capacity supplies the compute for all workloads, and per-user licenses control Power BI sharing and viewing.\n- The OneLake catalog, domains, OneLake security, and Microsoft Purview give one governance model for all items.\n- Copilot is in each workload, but it needs a paid capacity, and many functions are preview.\n- One retail flow uses a pipeline, a notebook, a lakehouse, a semantic model, a report, an Activator rule, and a data agent on one copy of data.\n- SaaS means Microsoft manages the infrastructure and engines, but the customer still manages capacity, access, data, and cost.\n- Source systems stay outside Fabric, and connectors, shortcuts, and mirroring connect them to OneLake."},{"i":"L3.next_lesson_suggestion","l":3,"t":"L3 > next_lesson_suggestion","x":"Lesson 4: What Microsoft Fabric is built for. Learn the problems it solves, how the one-copy design achieves them, and its strengths and weak points, with the same retail company."},{"i":"L4.title","l":4,"t":"L4 > title","x":"What Fabric Is For, How It Works, and Where It Is Weak"},{"i":"L4.learning_goal","l":4,"t":"L4 > learning_goal","x":"Learn which problem Microsoft Fabric solves, how its mechanisms solve it, and which strengths and limits to examine before you choose it."},{"i":"L4.prerequisite_lessons","l":4,"t":"L4 > prerequisite_lessons","x":"- 1\n- 2"},{"i":"L4.problem_before_fabric.description","l":4,"t":"L4 > problem_before_fabric > description","x":"Before Microsoft Fabric, a company usually built analytics from separate products. Each product had its own storage, its own copy of the data, its own bill, and its own security model. Teams had to connect the products and keep the copies the same. The retail company from lessons 1 and 2 (40 stores, one online shop, about 2,000 products) had this situation."},{"i":"L4.problem_before_fabric.retail_example_before","l":4,"t":"L4 > problem_before_fabric > retail_example_before","x":"POS database (orders)\n   |  ETL tool job 1 (own scheduler, own bill)\n   v\nData lake (copy 1: raw files)          security model A: storage access keys and ACLs\n   |  ETL tool job 2\n   v\nData warehouse (copy 2: tables)        security model B: SQL logins and grants\n   |  BI import refresh\n   v\nBI tool dataset (copy 3: imported)     security model C: BI workspace roles\n   |\n   v\nReports: sales team \"sales\" = 1,250,000   finance team \"sales\" = 1,180,000\n\nBills: lake storage + ETL tool + warehouse compute + BI licenses = 4 bills\n"},{"i":"L4.problem_before_fabric.pain_points","l":4,"t":"L4 > problem_before_fabric > pain_points","x":"-\n  pain: Many copies of the same data\n  effect: The copies are current at different times, so the sales report and the finance report can show different values for the same day.\n-\n  pain: Many separate tools\n  effect: The data team must connect, monitor, and upgrade each tool. A failure in one load job stops all tools after it.\n-\n  pain: Many bills\n  effect: The company cannot easily see the total cost of one report, because the cost is split across storage, ETL, warehouse, and BI bills.\n-\n  pain: Many security models\n  effect: An administrator must give and remove access in each tool. A person can lose access in the warehouse but keep access to a copy in the lake.\n-\n  pain: Business formulas in many places\n  effect: Each team writes its own SQL for 'Net Sales', so the numbers disagree (lesson 2, concept 3)."},{"i":"L4.design_goals.0","l":4,"t":"L4 > design_goals > 0","x":"goal: One platform for all analytics tasks, from data movement to business intelligence (BI), without manual integration of separate services.\nmechanism: Workloads supply item types in one workspace on one capacity. This is the container chain (lesson 2, concept 1).\nverified_source: What is Microsoft Fabric? (Microsoft Learn, footer 2026-03-31, metadata 2026-09-29)"},{"i":"L4.design_goals.1","l":4,"t":"L4 > design_goals > 1","x":"goal: One store for all organizational data, with no data silos and with zero-copy access.\nmechanism: One OneLake for each tenant, and OneLake shortcuts to other data. This is the data chain and 'same data, many workloads' (lesson 2, concepts 2 and 4).\nverified_source: OneLake overview (Microsoft Learn, footer 2026-08-23, metadata 2026-10-02)"},{"i":"L4.design_goals.2","l":4,"t":"L4 > design_goals > 2","x":"goal: Open data that is not locked in a proprietary format.\nmechanism: Tables in OneLake use the open Delta Parquet format or Apache Iceberg format. Spark, T-SQL, and Power BI read the same files (lesson 2, concept 4).\nverified_source: OneLake overview (Microsoft Learn, footer 2026-08-23)"},{"i":"L4.design_goals.3","l":4,"t":"L4 > design_goals > 3","x":"goal: Delivery as software as a service (SaaS), so users do not manage infrastructure such as resource groups or regions for each service.\nmechanism: Microsoft hosts and operates the engines. The customer buys a capacity and creates workspaces and items (lesson 2, concept 1).\nverified_source: What is Microsoft Fabric? (Microsoft Learn, footer 2026-03-31)"},{"i":"L4.design_goals.4","l":4,"t":"L4 > design_goals > 4","x":"goal: Central discovery, access control, and governance that are the same across workloads.\nmechanism: Workspace roles, OneLake security roles, the OneLake catalog, domains, and Microsoft Purview apply to items in OneLake (lesson 2, concept 1).\nverified_source: Governance and compliance in Microsoft Fabric (Microsoft Learn, 2026-09-29)"},{"i":"L4.design_goals.5","l":4,"t":"L4 > design_goals > 5","x":"goal: Artificial intelligence (AI) help that respects tenant, data, and permission boundaries.\nmechanism: Copilot and the data agent read data through the permissions of the user. A semantic layer closes the semantic gap (lesson 2, concepts 6 and 7).\nverified_source: What is Microsoft Fabric? (Microsoft Learn, footer 2026-03-31)"},{"i":"L4.how_it_works.0","l":4,"t":"L4 > how_it_works > 0","x":"mechanism: OneLake and one copy of data\nexplanation: Each tenant has exactly one OneLake. All Fabric engines read and write data directly in OneLake. A shortcut points to data in another workspace, in Azure Data Lake Storage (ADLS), in Amazon S3, or in other sources. The data stays in its place.\nbefore_after: Before: POS DB -> lake (copy 1) -> warehouse (copy 2) -> BI import (copy 3)\nAfter:  POS DB -> pipeline -> OneLake: SalesLakehouse/Tables/orders (1 copy)\n        Spark, SQL analytics endpoint, and Direct Lake read the same files.\n        The \"Finance\" workspace uses a shortcut. It does not make a copy.\n\nstatus: GA. OneLake and shortcuts have no preview label (OneLake overview, footer 2026-08-23; shortcuts page, footer 2026-07-13)."},{"i":"L4.how_it_works.1","l":4,"t":"L4 > how_it_works > 1","x":"mechanism: Open Delta Parquet format\nexplanation: Fabric stores tables as Delta Parquet files, or as Apache Iceberg files. OneLake also supports the ADLS Gen2 APIs and SDKs. So, tools outside Fabric can read the files, for example Azure Databricks. Fabric engines do not all support the same Delta features. For example, some engines cannot read or write deletion vectors or liquid clustering.\nbefore_after: Before: the warehouse keeps \"orders\" in an internal format.\n        To use Spark, the team exports the table to the lake.\nAfter:  Spark writes \"orders\" as Delta Parquet.\n        T-SQL reads it on the SQL analytics endpoint.\n        An external tool reads it through the ADLS Gen2 API.\n\nstatus: GA for Delta tables in OneLake. Feature support differs by engine (Delta Lake interoperability, Microsoft Learn, 2026-10-07)."},{"i":"L4.how_it_works.2","l":4,"t":"L4 > how_it_works > 2","x":"mechanism: Shared capacity\nexplanation: A capacity is one pool of capacity units (CUs). All workspaces on the capacity use the pool. Bursting lets a job use more CUs than the size of the capacity for a short time. Smoothing spreads the CU use over time: 5 to 64 minutes for interactive jobs, 24 hours for background jobs. If the capacity uses too much future compute, Fabric throttles it in stages.\nbefore_after: Before: lake bill + ETL bill + warehouse bill + BI bill. Each tool has its own compute.\nAfter:  one F64 capacity \"Retail-F64\" runs the pipeline, the notebook,\n        the SQL queries, and the report refresh.\n        One Capacity Metrics app shows the CU use of each item.\n\nstatus: GA for capacity, bursting, smoothing, and throttling (Throttling, Microsoft Learn, 2026-08-14). Capacity-level surge protection has no preview label. Workspace-level surge protection is preview (Surge protection, Microsoft Learn, 2026-09-29)."},{"i":"L4.how_it_works.3","l":4,"t":"L4 > how_it_works > 3","x":"mechanism: Shared security and governance\nexplanation: Workspace roles control who can create and read items. OneLake security roles can limit access to folders, tables, rows, and columns, and OneLake applies them across SQL, Spark, and Power BI. Domains, endorsement, lineage, and the OneLake catalog help people find and trust data. Microsoft Purview adds sensitivity labels, data loss prevention (DLP), and audit, with Purview licenses.\nbefore_after: Before: remove a store manager from the lake ACL, the warehouse grants,\n        and the BI workspace. Three tasks, three tools.\nAfter:  remove the store manager from the workspace role and the\n        OneLake security role. Spark, SQL, and Power BI all apply it.\n\nstatus: Mixed. Workspace roles are GA. The OneLake security page gives no overall status, and it marks enforcement in third-party engines as preview (Microsoft Learn, 2026-09-01). Purview live view is preview (Governance overview, Microsoft Learn, 2026-09-29)."},{"i":"L4.how_it_works.4","l":4,"t":"L4 > how_it_works > 4","x":"mechanism: SaaS delivery\nexplanation: Microsoft hosts, updates, and operates the Fabric engines. The customer buys an F SKU in Azure, with pay-as-you-go billing for each second or with a yearly reservation. The customer can pause a capacity to stop compute billing. OneLake storage is billed separately for each GB, also during a pause.\nbefore_after: Before: the team sets up a cluster, a warehouse server, and a BI gateway,\n        and applies upgrades to each one.\nAfter:  the team creates a workspace, assigns it to \"Retail-F64\",\n        and creates a lakehouse. Microsoft applies the upgrades.\n\nstatus: GA. Licenses page (Microsoft Learn, 2026-08-05); OneLake consumption page (Microsoft Learn, 2026-09-29); Pause and resume page (Microsoft Learn, 2026-04-20)."},{"i":"L4.strengths.0","l":4,"t":"L4 > strengths > 0","x":"strength: Fewer data copies\nreason: All Fabric engines read the same Delta files in OneLake, and shortcuts point to data without a copy.\nretail_example: The sales report, the finance report, and the data agent all read one 'orders' table, so all three use the same data at the same time.\ntrue_when: The tables are in OneLake or are available through a shortcut, and each engine that you use supports the Delta features of the table."},{"i":"L4.strengths.1","l":4,"t":"L4 > strengths > 1","x":"strength: One definition of each business number\nreason: A Power BI semantic model in Direct Lake mode reads OneLake tables and keeps measures in one place.\nretail_example: Both teams use the measure [Net Sales], so both reports show 1,180,000, not two different values.\ntrue_when: The team puts formulas in the semantic model, not in each report, and other tools query that model."},{"i":"L4.strengths.2","l":4,"t":"L4 > strengths > 2","x":"strength: One place to see and control compute cost\nreason: All workloads use CUs from a capacity, and the Capacity Metrics app shows CU use for each item.\nretail_example: The IT budget owner sees that the 'CleanOrders' notebook uses most of the CUs of 'Retail-F64'.\ntrue_when: The company has few capacities, and an administrator reviews the Capacity Metrics app at regular intervals."},{"i":"L4.strengths.3","l":4,"t":"L4 > strengths > 3","x":"strength: Less infrastructure work\nreason: Microsoft operates the engines as SaaS, so the team does not manage servers, clusters, or upgrades.\nretail_example: A team of two data engineers runs the retail data platform with no server administration.\ntrue_when: The team accepts the configuration options that Fabric gives, and does not need control of the infrastructure."},{"i":"L4.strengths.4","l":4,"t":"L4 > strengths > 4","x":"strength: Open storage format reduces data lock-in\nreason: Delta Parquet and Apache Iceberg are open formats, and OneLake supports the ADLS Gen2 APIs.\nretail_example: A partner reads the 'products' table with an external Spark tool through the ADLS Gen2 API, without an export job.\ntrue_when: The external tool supports the Delta features of the table, and the tenant setting for external apps allows the access."},{"i":"L4.strengths.5","l":4,"t":"L4 > strengths > 5","x":"strength: One security model across engines\nreason: OneLake security roles apply table, row, and column rules across SQL, Spark, and Power BI.\nretail_example: A row rule lets the Chennai store manager see only the orders of store CH01, in SQL and in Power BI.\ntrue_when: The users are Viewers or have only Read permission. Workspace Admins, Members, and Contributors can read all data in the workspace."},{"i":"L4.strengths.6","l":4,"t":"L4 > strengths > 6","x":"strength: A base for AI agents on governed data\nreason: The data agent reads data with the permissions of the user, and it can use a semantic model as its data source.\nretail_example: A store manager asks the data agent for last week's net sales, and the agent uses [Net Sales] from the semantic model.\ntrue_when: The semantic model is complete and correct. Without it, the semantic gap from lesson 2, concept 6 stays."},{"i":"L4.weak_points.0","l":4,"t":"L4 > weak_points > 0","x":"weak_point: Many components are in preview\nreason: Microsoft Learn lists dozens of preview features. Even GA items can contain preview functions, for example some Git integration support for semantic models and reports.\nretail_example: The team wants to use the ontology for the board report, but the ontology is preview and has no SLA.\nhow_to_reduce_risk: Use the decision rule from lesson 2, concept 5. Keep the production path on GA components, and write a GA fallback for each preview component."},{"i":"L4.weak_points.1","l":4,"t":"L4 > weak_points > 1","x":"weak_point: Shared-capacity contention\nreason: All workspaces on a capacity use the same CU pool. When the capacity uses too much future compute, Fabric delays or rejects new jobs, for all workspaces on it.\nretail_example: A large finance notebook makes the capacity throttle, and store managers cannot open the 'Daily Store Sales' report.\nhow_to_reduce_risk: Put production and development on different capacities. Turn on capacity-level surge protection. Test workspace-level surge protection, which is preview."},{"i":"L4.weak_points.2","l":4,"t":"L4 > weak_points > 2","x":"weak_point: Cost and capacity planning are difficult\nreason: Smoothing and bursting make CU use hard to predict. Storage is billed separately, also during a pause. Below F64, each report viewer needs a Pro or Premium Per User (PPU) license.\nretail_example: The company buys F32 to save money, and then must buy Pro licenses for 40 store managers to view reports.\nhow_to_reduce_risk: Use the 60-day trial (64 CUs) with real retail data. Measure CU use in the Capacity Metrics app. Compare the F SKU cost with the license cost before you buy."},{"i":"L4.weak_points.3","l":4,"t":"L4 > weak_points > 3","x":"weak_point: Vendor lock-in outside the data files\nreason: The data files are open, but pipelines, semantic models, reports, capacities, and security roles are Fabric or Power BI objects. Microsoft hosts all of them.\nretail_example: The data team can move the 'orders' Delta files to another platform, but must rebuild the pipelines, the DAX measures, and the reports.\nhow_to_reduce_risk: Keep core data in Delta tables. Keep transformation logic in code, for example Spark notebooks in Git. Record the business rules outside Fabric too."},{"i":"L4.weak_points.4","l":4,"t":"L4 > weak_points > 4","x":"weak_point: Learning curve\nreason: Fabric has many workloads, item types, and engines. Each engine has its own language, settings, and limits, for example Spark, T-SQL, DAX, and KQL.\nretail_example: An analyst knows SQL, but must also learn DAX for measures and the SQL analytics endpoint rule that it is read-only.\nhow_to_reduce_risk: Start with a small set of items: one pipeline, one lakehouse, one semantic model, and one report. Add other workloads only when a need exists."},{"i":"L4.weak_points.5","l":4,"t":"L4 > weak_points > 5","x":"weak_point: Feature gaps between engines and against other products\nreason: Fabric Data Warehouse does not support all SQL Server T-SQL statements. Delta feature support differs by engine. Warehouse connections must stay in one region.\nretail_example: A Python notebook with the 'deltalake' library cannot write a table with deletion vectors, so the team must use a PySpark notebook.\nhow_to_reduce_risk: Read the T-SQL surface area page, the Delta Lake interoperability page, and the known issues list before you migrate. Test each important query."},{"i":"L4.weak_points.6","l":4,"t":"L4 > weak_points > 6","x":"weak_point: Governance needs continuous effort\nreason: Fabric gives governance tools, but people must design domains, assign roles, edit the DefaultReader role, certify items, and review audit logs. Purview functions need Purview licenses.\nretail_example: Every user with ReadAll can read the 'customers' table through the DefaultReader role, until an administrator changes the role.\nhow_to_reduce_risk: Name an owner for each domain and workspace. Review the DefaultReader role in each lakehouse. Use endorsement to mark the certified retail tables."},{"i":"L4.weak_points.7","l":4,"t":"L4 > weak_points > 7","x":"weak_point: Region boundaries\nreason: Each workspace uses a capacity in one region. Warehouse and SQL analytics endpoint connections across regions are not supported.\nretail_example: A workspace on a capacity in a different region cannot connect to the SQL analytics endpoint of 'SalesLakehouse' in the main region.\nhow_to_reduce_risk: Choose the capacity region at the start. Keep connected warehouse and lakehouse items in the same region."},{"i":"L4.comparison.classic_stack_vs_fabric","l":4,"t":"L4 > comparison > classic_stack_vs_fabric","x":"-\n  aspect: Data copies\n  classic_stack: Usually one copy for each tool: lake, warehouse, and BI import.\n  fabric: One copy in OneLake. Shortcuts point to other data.\n-\n  aspect: Storage format\n  classic_stack: Depends on each tool. Some warehouses use an internal format.\n  fabric: Delta Parquet or Apache Iceberg in OneLake.\n-\n  aspect: Compute and billing\n  classic_stack: One bill and one compute model for each tool. One tool does not slow down another tool.\n  fabric: One capacity for many workloads. One bill, but jobs can slow down other jobs on the same capacity.\n-\n  aspect: Security\n  classic_stack: One security model for each tool. Access changes need many tasks.\n  fabric: Workspace roles and OneLake security roles apply across SQL, Spark, and Power BI.\n-\n  aspect: Operations\n  classic_stack: The team connects, upgrades, and monitors each tool.\n  fabric: Microsoft operates the engines as SaaS. The team has less infrastructure control.\n-\n  aspect: Choice of tools\n  classic_stack: The team can choose the best product for each layer from any vendor.\n  fabric: The team uses the Fabric engines, and connects other tools through open files and APIs."},{"i":"L4.comparison.other_platforms","l":4,"t":"L4 > comparison > other_platforms","x":"-\n  platform: Azure Databricks\n  verified_notes: Azure Databricks is a lakehouse platform that uses Delta Lake and Apache Spark. It connects to cloud storage and security in the customer's own cloud account. Unity Catalog gives one governance model with access control lists (ACLs). Databricks documentation exists for AWS, Azure, and Google Cloud. OneLake supports access from Azure Databricks, so the two products can share Delta data. Sources: What is Azure Databricks? (Microsoft Learn, 2026-09-11); Databricks introduction (docs.databricks.com); OneLake overview.\n  not_verified:\n    - Any performance comparison between Databricks and Fabric\n    - Any cost comparison between Databricks and Fabric\n-\n  platform: Snowflake\n  verified_notes: Snowflake separates storage and compute. Each virtual warehouse is an independent compute cluster, so one warehouse does not affect the performance of another warehouse. This differs from a Fabric capacity, where workspaces share one CU pool. Snowflake stores loaded data in an internal columnar format, and it also supports Apache Iceberg tables in external storage. Snowflake runs on AWS, Microsoft Azure, and Google Cloud. OneLake can make Delta tables readable by Iceberg-compatible services such as Snowflake. Sources: Snowflake key concepts and architecture (docs.snowflake.com); OneLake overview.\n  not_verified:\n    - Any performance comparison between Snowflake and Fabric\n    - Any cost comparison between Snowflake and Fabric"},{"i":"L4.decision_guide","l":4,"t":"L4 > decision_guide","x":"good_fit_when:\n  - The company already uses Power BI and Microsoft 365, and wants the data platform and the reports in one place.\n  - The company has many copies of the same data and reports that disagree.\n  - The data team is small and does not want to operate infrastructure.\n  - The company accepts Microsoft as the host and Azure as the place to buy capacity.\n  - The production path can use only GA components.\npoor_fit_when:\n  - The production path depends on preview components, with no GA fallback.\n  - Teams need strict compute isolation, but the budget allows only one capacity.\n  - The company must avoid one main vendor for compute, BI, and governance.\n  - The workload needs T-SQL statements or Delta features that the Fabric engines do not support.\n  - The company needs full control of the infrastructure, for example cluster settings or network topology beyond the Fabric options.\ncheck_first:\n  - Examine the status of each component on its Microsoft Learn page, and record the page date.\n  - Run a 60-day trial with real data, and measure CU use in the Capacity Metrics app.\n  - Count the report viewers, and compare the cost of F64 or larger with Pro licenses on a smaller F SKU.\n  - Read the T-SQL surface area page and the Delta Lake interoperability page for your workload.\n  - Choose the capacity region, and plan how many capacities you need to separate production from development.\n  - Name the owners for domains, workspaces, and security roles before you load data."},{"i":"L4.fabric_iq_pointer","l":4,"t":"L4 > fabric_iq_pointer","x":"This lesson shows that Fabric gives one copy of data, one semantic model, and one security model. It does not give a full business vocabulary that agents can follow across many tables. Lesson 5 shows how Fabric IQ adds that layer with an ontology, and how its preview status affects the decision rule."},{"i":"L4.check_questions","l":4,"t":"L4 > check_questions","x":"-\n  question: Name three pain points of the 'before Fabric' retail stack.\n  answer: Many copies of the same data, many bills, and many security models. Others are many tools and business formulas in many places.\n-\n  question: Which Fabric mechanism removes the copy between the lake and the warehouse?\n  answer: OneLake with Delta tables. Spark writes the table one time, and the SQL analytics endpoint reads the same files.\n-\n  question: Is OneLake storage free when you pause the capacity?\n  answer: No. OneLake storage is billed for each GB, also when the capacity is paused.\n-\n  question: A finance job makes the shared capacity throttle. Why do store managers see a problem?\n  answer: All workspaces on a capacity use the same CU pool, so throttling affects all of them.\n-\n  question: The company buys F32. What must each store manager have to view Power BI reports?\n  answer: A Pro, Premium Per User (PPU), or individual trial license. On F64 or larger, a Free license with the Viewer role is sufficient.\n-\n  question: The data files are open Delta Parquet. Does this remove all vendor lock-in?\n  answer: No. Pipelines, semantic models, reports, and security roles are Fabric or Power BI objects, and you must rebuild them on another platform.\n-\n  question: How is Snowflake compute isolation different from a Fabric capacity?\n  answer: Each Snowflake virtual warehouse is independent compute. In Fabric, all workspaces on one capacity share the CU pool."},{"i":"L4.status_note.p0","l":4,"t":"L4 > status_note","x":"Status of each component on 2026-11-07. Each line gives the source and the source date.\n- OneLake and OneLake shortcuts: GA. No preview label (OneLake overview, footer 2026-08-23, metadata 2026-10-02; shortcuts page, footer 2026-07-13). The dates on the pages disagree.\n- Delta tables in OneLake: GA. Feature support differs by engine and Spark runtime (Delta Lake interoperability, 2026-10-07).\n- Capacity, F SKU, bursting, smoothing, throttling: GA (Throttling, 2026-08-14; Licenses, 2026-08-05).\n- Capacity-level surge protection: No preview label. Workspace-level surge protection: preview (Surge protection, 2026-09-29).\n- Pause and resume: GA (Pause and resume, visible date 2026-04-20, metadata 2026-08-14; dates disagree).\n- Workspace roles: GA (lesson 2 source, 2026-08-18).\n- OneLake security roles: Unclear. The page gives no overall status. Enforcement in third-party engines is preview (OneLake security, 2026-09-01, metadata 2026-09-29).\n- Governance tools (domains, endorsement, lineage, OneLake catalog): No preview label. Purview live view is preview. The Govern section has a regional rollout (Governance overview, 2026-09-29).\n- Git integration: Mixed. Lakehouse, notebooks, and pipelines have no preview label. Power BI reports and semantic models, ontology, and Plan are preview (Git integration, footer 2026-09-29, metadata 2026-10-17).\n- Data agent: GA (lesson 1 source, 2026-05-11).\n- Direct Lake: Mixed (lesson 2 status_note).\n- Ontology and Fabric IQ: Preview on Microsoft L"},{"i":"L4.status_note.p1","l":4,"t":"L4 > status_note","x":"earn. One analyst source reports GA for Fabric IQ. Sources disagree (lessons 1 and 2).\n- The 'What is Microsoft Fabric?' page shows three dates: ms.date 2026-03-18, footer 2026-03-31, metadata 2026-09-29.\n- I did not verify performance or cost comparisons between Fabric, Databricks, and Snowflake, so this lesson does not give them.\nPreview status changes frequently. Examine the Microsoft Learn page for each component before you use it in production.\n"},{"i":"L4.summary_bullets","l":4,"t":"L4 > summary_bullets","x":"- Before Fabric, a retail company had many tools, many data copies, many bills, and many security models.\n- Fabric puts all workloads on one OneLake, one capacity model, and one governance layer, delivered as SaaS.\n- Open Delta Parquet files let many engines read one copy, but engines do not support all Delta features.\n- A shared capacity gives one bill, but one large job can throttle all workspaces on it.\n- Storage is billed separately, and below F64 each report viewer needs a Pro or PPU license.\n- Open files reduce data lock-in, but pipelines, models, and reports stay Fabric objects.\n- Governance tools exist, but people must design and maintain domains, roles, and labels.\n- Before you choose Fabric, check component status, run a trial, measure CUs, and plan regions."},{"i":"L4.next_lesson_suggestion","l":4,"t":"L4 > next_lesson_suggestion","x":"Lesson 5: Fabric IQ. Learn how the ontology, bindings, Graph, Plan, and agents add a business-meaning layer on top of OneLake and the semantic model, and how to apply the GA and preview decision rule to it."},{"i":"L5.title","l":5,"t":"L5 > title","x":"Fabric IQ: The Business-Meaning Layer for People and Agents"},{"i":"L5.learning_goal","l":5,"t":"L5 > learning_goal","x":"Learn what Fabric IQ adds on top of OneLake and the Power BI semantic model, how each component operates, and when to use it now or wait."},{"i":"L5.prerequisite_lessons","l":5,"t":"L5 > prerequisite_lessons","x":"- 1\n- 2\n- 3\n- 4"},{"i":"L5.corrections_to_earlier_lessons.0","l":5,"t":"L5 > corrections_to_earlier_lessons > 0","x":"lesson: 1\nearlier_statement: Term 19 (rule): A rule is business logic in natural language. Common mistake: Microsoft Learn describes a rule as context, not as enforcement.\ncorrected_statement: This statement is correct for the new ontology experience, but it is incomplete. A rule has a name, a natural-language definition, and optional links to entity types, properties, and relationship types. The ontology does not run the rule against data and does not start actions. The new experience has no direct integration with Activator, so you must set up alerts in Activator separately. In the old ontology experience, Activator rules on entity types sent alerts. These Activator rules do not migrate to the new experience. Agents read rules through the MCP tool 'list_ontology_rules', and the agent must interpret them.\nsource: Create and manage business rules in ontology (preview), Microsoft Learn, updated 2026-09-29; Ontology overview, Microsoft Learn, updated 2026-10-16"},{"i":"L5.corrections_to_earlier_lessons.1","l":5,"t":"L5 > corrections_to_earlier_lessons > 1","x":"lesson: 1\nearlier_statement: Term 23 (operations agent), common mistake: an operations agent rule is a query with a condition, and an ontology rule is natural-language context.\ncorrected_statement: This statement is correct. An operations agent rule runs as a query on its data source every 5 minutes. The data source can be an eventhouse or an ontology. A Microsoft Fabric blog post says that the operations agent use of the ontology for playbooks is 'coming soon', so the depth of this integration is not complete.\nsource: Operations agent in Real-Time Intelligence, Microsoft Learn, updated 2026-10-21; 'What's next for Fabric IQ Ontology', Microsoft Fabric Updates Blog, no date on page"},{"i":"L5.corrections_to_earlier_lessons.2","l":5,"t":"L5 > corrections_to_earlier_lessons > 2","x":"lesson: 1\nearlier_statement: Status note: operations agent status not verified on Microsoft Learn.\ncorrected_statement: The Release status of AI and Copilot experiences page lists 'Get started with operations agent' as GA (updated 2026-07-12). The operations agent page itself gives no label (updated 2026-10-21). New functions, for example pre-approved actions and root-cause analysis, are preview (Azure blog, 2026-09-28). Status is mixed.\nsource: Release status of AI and Copilot experiences in Fabric, Microsoft Learn, updated 2026-07-12; Azure blog 'FabCon and SQLCon 2026 in Barcelona', 2026-09-28"},{"i":"L5.corrections_to_earlier_lessons.3","l":5,"t":"L5 > corrections_to_earlier_lessons > 3","x":"lesson: 1\nearlier_statement: Term 13 (ontology): The ontology connects to live data.\ncorrected_statement: Bindings point to data in place and do not copy it. But new rows in the source do not appear automatically in the ontology. You must refresh the ontology item. The data agent also refreshes its ontology context every 10 minutes.\nsource: Data binding in ontology (preview), Microsoft Learn, updated 2026-10-21; Use Ontology as context in Fabric data agent, Microsoft Learn, 2026-10-05"},{"i":"L5.corrections_to_earlier_lessons.4","l":5,"t":"L5 > corrections_to_earlier_lessons > 4","x":"lesson: 1\nearlier_statement: Term 20 (Graph): Some business questions need many connection steps, and Graph answers them faster than tables.\ncorrected_statement: Microsoft Learn says that Graph avoids many joins and suits multihop, dependency, reachability, and shortest-path questions. I did not find a verified speed comparison, so the word 'faster' is not verified. Microsoft Learn calls Graph an optional execution layer for an ontology.\nsource: Graph in Microsoft Fabric overview, Microsoft Learn, updated 2026-05-20; Ontology overview, Microsoft Learn, updated 2026-10-16"},{"i":"L5.corrections_to_earlier_lessons.5","l":5,"t":"L5 > corrections_to_earlier_lessons > 5","x":"lesson: 1\nearlier_statement: Status note: data agent is GA.\ncorrected_statement: Sources disagree. The data agent concept page says GA (2026-05-11). The Release status page lists 'Create a Fabric data agent' as preview (2026-07-12). The use of an ontology as a data agent source is preview, and Microsoft Learn reported an ongoing outage for it (2026-10-05).\nsource: Fabric data agent concepts, 2026-05-11; Release status of AI and Copilot experiences, 2026-07-12; Use Ontology as context in Fabric data agent, 2026-10-05 (all Microsoft Learn)"},{"i":"L5.corrections_to_earlier_lessons.6","l":5,"t":"L5 > corrections_to_earlier_lessons > 6","x":"lesson: 2\nearlier_statement: Concept 7, step 3: A data agent uses the ontology as a data source.\ncorrected_statement: The data agent adds the ontology as a source, but the ontology gives semantic context only. The ontology is not the query endpoint. The data agent sends each question to one underlying source and writes a SQL, KQL, or DAX query for that source. The query runs with the permissions of the user.\nsource: Use Ontology as context in Fabric data agent (preview), Microsoft Learn, 2026-10-05"},{"i":"L5.corrections_to_earlier_lessons.7","l":5,"t":"L5 > corrections_to_earlier_lessons > 7","x":"lesson: 2\nearlier_statement: Concept 5 example: data agent GA, production path, with review.\ncorrected_statement: The data agent on a semantic model or a lakehouse can stay on the production path with review, because its concept page says GA. A data agent that uses an ontology belongs on the trial path, because that function is preview.\nsource: Fabric data agent concepts, 2026-05-11; Use Ontology as context in Fabric data agent, 2026-10-05 (Microsoft Learn)"},{"i":"L5.corrections_to_earlier_lessons.8","l":5,"t":"L5 > corrections_to_earlier_lessons > 8","x":"lesson: 3\nearlier_statement: Data Science workload lists the data agent; the Fabric overview also lists the data agent under Fabric IQ.\ncorrected_statement: Both are correct. The Fabric IQ overview lists the data agent as a Fabric IQ item that is also in the Data Science workload. It also lists Graph and the operations agent as Fabric IQ items that are also in the Real-Time Intelligence workload, and the semantic model as also in Power BI.\nsource: What is Fabric IQ?, Microsoft Learn, updated 2026-09-29"},{"i":"L5.corrections_to_earlier_lessons.9","l":5,"t":"L5 > corrections_to_earlier_lessons > 9","x":"lesson: 3\nearlier_statement: Status note: rules on ontology entities for alerts are preview.\ncorrected_statement: This applies to the old ontology experience. The new experience has no direct Activator integration, and the old experience retires on 2027-01-31.\nsource: Create and manage business rules in ontology (preview), Microsoft Learn, updated 2026-09-29; Ontology overview, updated 2026-10-16"},{"i":"L5.what_fabric_iq_is.definition","l":5,"t":"L5 > what_fabric_iq_is > definition","x":"Fabric IQ is a workload in Microsoft Fabric. Microsoft Learn shows its name as 'IQ (preview)'. It gives one business vocabulary over data in OneLake, so people and agents use the same business words. It has three layers: unified data in OneLake, business intelligence in Power BI semantic models, and operational intelligence in ontologies. Its items are the ontology, the Power BI semantic model, Plan (planning), Graph, the data agent, and the operations agent."},{"i":"L5.what_fabric_iq_is.problem_it_solves","l":5,"t":"L5 > what_fabric_iq_is > problem_it_solves","x":"Lesson 2 concept 6 shows the semantic gap. An agent reads column names such as 'st_cd' and 'sts' and guesses their meaning. The SQL runs, but the answer is wrong. A semantic model closes part of the gap with measures, but it describes tables for reports. The ontology describes business concepts, relationships, and rules across many sources, for example a lakehouse and an eventhouse. Agents read this description before they write a query."},{"i":"L5.what_fabric_iq_is.before_after.p0","l":5,"t":"L5 > what_fabric_iq_is > before_after","x":"Raw table in 'SalesLakehouse': ord_hdr\nord_no | st_cd | amt    | sts | ref_amt\n10021  | CH01  | 1500.0 | C   | 0.0\n10022  | CH01  | 900.0  | X   | 0.0\n10023  | CH01  | 700.0  | C   | 200.0\n\nBEFORE (agent sees only the raw schema):\n  Question: \"What were the net sales of the Chennai Main Road store last week?\"\n  Agent guess: SELECT SUM(amt) FROM ord_hdr WHERE st_cd = 'CH01';      -> 3100.0 (wrong)\n  The agent does not know that 'X' means cancelled, that refunds reduce sales,\n  or that 'CH01' is the store 'Chennai Main Road'.\n\nAFTER (agent reads the ontology first):\n  Entity type Order    <- binding: ord_hdr (key: ord_no)\n    Order.Status       <- ord_hdr.sts\n    Order.Amount       <- ord_hdr.amt\n    Order.RefundAmount <- ord_hdr.ref_amt\n  Entity type Store    <- binding: stores (key: store_code)\n    Store.Name         <- stores.store_name  ('Chennai Main Road' -> 'CH01')\n  Relationship: Store receives Order  (ord_hdr.st_cd = stores.store_code)\n  Rule \"Net sales\": Net sales of an order is Amount minus RefundAmount.\n                    Do not count orders with Status 'X' (cancelled).\n\n  Agent query on the bound source:\n  SELECT SUM(o.amt - o.ref_amt) FROM ord_hdr o\n  JOIN stores s ON s.store_code = o.st_cd\n  WHERE s.store_name = 'Chennai Main Road' AND o.sts <> 'X';          -> 2000.0 (correct)\n\nIMPORTANT: the rule is text. The ontology does not enforce it.\nThe answer is correct only when the agent reads and follows the rule.\nYou must test the agent with known answers, for examp"},{"i":"L5.what_fabric_iq_is.before_after.p1","l":5,"t":"L5 > what_fabric_iq_is > before_after","x":"le 2000.0 for CH01.\n"},{"i":"L5.architecture.layers.0","l":5,"t":"L5 > architecture > layers > 0","x":"layer: 1. OneLake data (lakehouse, warehouse, eventhouse, mirrored database, SQL database)\nadds: One copy of the business data in Delta tables or KQL tables. This is the data chain from lesson 2 concept 2.\ndoes_not_do: It gives no business names, no business rules, and no measures. Column names such as 'sts' stay technical."},{"i":"L5.architecture.layers.1","l":5,"t":"L5 > architecture > layers > 1","x":"layer: 2. Power BI semantic model\nadds: Relationships between tables and tested DAX measures, for example [Net Sales]. This is the meaning chain from lesson 2 concept 3.\ndoes_not_do: It does not describe business concepts across many sources, and it does not hold natural-language rules for agents. It is designed for reports."},{"i":"L5.architecture.layers.2","l":5,"t":"L5 > architecture > layers > 2","x":"layer: 3. Ontology\nadds: Entity types, properties, relationships, rules, and metrics in business words, with bindings to sources in layers 1 and 2.\ndoes_not_do: It does not copy data, it does not run rules, and it does not start actions. It does not replace the lakehouse or the semantic model."},{"i":"L5.architecture.layers.3","l":5,"t":"L5 > architecture > layers > 3","x":"layer: 4. Graph (optional execution layer)\nadds: Nodes and edges on OneLake tables, and Graph Query Language (GQL) queries for multihop connection questions.\ndoes_not_do: It does not define business meaning. An ontology-derived schema graph does not load instance data by default."},{"i":"L5.architecture.layers.4","l":5,"t":"L5 > architecture > layers > 4","x":"layer: 5. Agents (ontology agent, data agent, operations agent, external agents through MCP)\nadds: Answers to questions in business words, monitoring with alerts, and recommended actions.\ndoes_not_do: The data agent does not change data. The ontology agent changes only ontology definitions, and only in Act mode. Agents do not guarantee a correct answer."},{"i":"L5.architecture.layers.5","l":5,"t":"L5 > architecture > layers > 5","x":"layer: 6. Plan (planning)\nadds: Budgets, forecasts, and scenarios on the same semantic models, with write-back of plan results to a SQL database in Fabric.\ndoes_not_do: It does not build on the ontology, according to Microsoft Learn. It uses semantic models. It is not a project task list."},{"i":"L5.architecture.ascii_diagram.p0","l":5,"t":"L5 > architecture > ascii_diagram","x":"CONSUMERS   store manager | finance analyst | coding agent (VS Code) | Foundry agent | Copilot Studio\n                 |                |                  |                     |\n+----------------v----------------v------------------v---------------------v-----------+\n| AGENTS      data agent      operations agent    ontology agent     ontology MCP server |\n|             (answers)       (monitors, alerts)  (builds, queries)  (external access)   |\n+-------------------------------------+------------------------------------------------+\n| PLAN (planning sheets)              |  reads semantic models, writes to SQL database   |\n+-------------------------------------+------------------------------------------------+\n| ONTOLOGY  entity types, properties, relationships, rules, metrics                    |\n|           --bindings (point, no copy)-->  layers below        ---optional--> GRAPH     |\n|                                                                           (GQL, nodes,|\n|                                                                            edges)     |\n+--------------------------------------------------------------------------------------+\n| POWER BI SEMANTIC MODEL  relationships + DAX measures, for example [Net Sales]        |\n+--------------------------------------------------------------------------------------+\n| ONELAKE DATA  lakehouse 'SalesLakehouse' (ord_hdr, stores, products, customers)       |\n|               eventhouse 'StockEvents' (stock levels with tim"},{"i":"L5.architecture.ascii_diagram.p1","l":5,"t":"L5 > architecture > ascii_diagram","x":"estamps)                 |\n+--------------------------------------------------------------------------------------+\n| CONTAINER CHAIN  capacity 'Retail-F64' -> workspace 'Store Sales' -> items            |\n+--------------------------------------------------------------------------------------+\n"},{"i":"L5.components.0","l":5,"t":"L5 > components > Ontology","x":"name: Ontology\npurpose: Define the business concepts of the retail company, their connections, and their rules, and connect them to live sources.\ninputs: Entity type definitions, plus bindings to an eventhouse, KQL database, lakehouse, mirrored database, semantic model, SQL database, or warehouse.\noutputs: A business vocabulary that agents and people read, entity instances from bound data, and metrics.\nconnects_to:\n  - OneLake data\n  - Power BI semantic model\n  - Graph\n  - data agent\n  - operations agent\n  - ontology agent\n  - ontology MCP server\nretail_example: The entity types Customer, Order, Product, and Store bind to lakehouse tables. The entity type StockLevel binds to the eventhouse with a timestamp column.\nlimits: Upstream changes need a manual refresh. Entity details work only with managed lakehouse tables, not external tables. Relationship names must be unique. Graph does not support the Decimal type. The old experience retires on 2027-01-31.\nstatus: Preview (Ontology overview, Microsoft Learn, updated 2026-10-16)."},{"i":"L5.components.1","l":5,"t":"L5 > components > Graph","x":"name: Graph\npurpose: Model and query connections in OneLake data as a labeled property graph.\ninputs: Structured tables in OneLake, with nodes and edges defined on the tables. An ontology can use Graph as an optional execution layer.\noutputs: Results of GQL queries, for example paths, reachability, and aggregations. NL2GQL lets users ask in natural language.\nconnects_to:\n  - OneLake data\n  - Ontology\n  - ontology agent\n  - data agent\nretail_example: Find all stores that sell a product from a supplier whose shipment has a delay, across the relationships Supplier -> Shipment -> Product -> Store.\nlimits: A minimum of 100 GB graph storage is provisioned. It is available in a list of about 35 regions. Graph-powered reasoning with a data agent is preview.\nstatus: Unclear. The Graph overview gives no label for the core function (updated 2026-05-20). The Fabric IQ overview links to it with the text 'Graph in Microsoft Fabric overview (preview)' (updated 2026-09-29)."},{"i":"L5.components.2","l":5,"t":"L5 > components > Plan (planning in Fabric IQ)","x":"name: Plan (planning in Fabric IQ)\npurpose: Make budgets, forecasts, and scenarios on the same semantic models that reports use.\ninputs: Fabric semantic models, historical data, and assumptions that users type in planning sheets.\noutputs: Planning sheets, PowerTable sheets, Intelligence sheets with variance analysis, and plan results written back to a SQL database in Fabric.\nconnects_to:\n  - Power BI semantic model\n  - SQL database in Fabric\nretail_example: The finance team makes the 2027 sales budget for each of the 40 stores from [Net Sales] and writes the budget to a SQL database.\nlimits: XMLA-based scenarios need an F SKU or Premium P1 to P5. Power BI Pro and PPU are not supported for them. Some lower SKUs have XMLA and memory limits.\nstatus: Probably GA, but not labeled. Microsoft Learn says planning is available worldwide as part of the Fabric SKU (Plan overview, updated 2026-08-31 or 2026-10-01; dates on the page disagree)."},{"i":"L5.components.3","l":5,"t":"L5 > components > Data agent","x":"name: Data agent\npurpose: Answer natural-language questions about Fabric data with read-only queries.\ninputs: A question, agent instructions, and up to 5 sources: lakehouse, warehouse, semantic model, KQL database, mirrored database, ontology, or Microsoft Graph.\noutputs: An answer as a table, a summary, or insights. Results are capped at 25 rows and 25 columns.\nconnects_to:\n  - Ontology\n  - Power BI semantic model\n  - OneLake data\n  - Microsoft Foundry\n  - Copilot Studio\n  - Microsoft 365 Copilot\n  - Microsoft Teams\nretail_example: A store manager asks for last week's net sales of 'Chennai Main Road'. The agent uses the ontology context and queries the lakehouse.\nlimits: Read-only. English gives the best results. You cannot change the LLM. Each question goes to one source, with no joins across sources. It does not work with an ontology that uses semantic model bindings (known issue). Source and agent capacity must be in the same region.\nstatus: Mixed. Concept page: GA (2026-05-11). Release status page: preview (2026-07-12). Ontology as a source: preview, with an outage (2026-10-05)."},{"i":"L5.components.4","l":5,"t":"L5 > components > Operations agent","x":"name: Operations agent\npurpose: Monitor data against goals and rules, and send messages or recommend actions.\ninputs: An eventhouse (KQL database) or an ontology as the data source, plus goals, instructions, and rules.\noutputs: Microsoft Teams messages, recommendations, and actions that run after a recipient approves them.\nconnects_to:\n  - Ontology\n  - eventhouse\n  - Microsoft Teams\n  - Power Automate (through approved actions)\nretail_example: The agent checks stock every 5 minutes and sends a Teams message to the Chennai store manager when a product is below 10 units.\nlimits: Rules run every 5 minutes. Trial capacities are not supported. A Teams account is necessary. Actions run with the permissions of the creator. Ontology integration for playbooks is 'coming soon' (blog).\nstatus: Mixed. Release status page: GA (2026-07-12). Operations agent page: no label (2026-10-21). Pre-approved actions and root-cause analysis: preview (Azure blog, 2026-09-28)."},{"i":"L5.components.5","l":5,"t":"L5 > components > Power BI semantic model (as a source)","x":"name: Power BI semantic model (as a source)\npurpose: Give tested measures and relationships to the ontology, the data agent, Plan, and reports.\ninputs: Lakehouse or warehouse tables, in Direct Lake or another storage mode.\noutputs: DAX measure results. When you generate an ontology from it, it gives entity types, properties, relationships, and metrics.\nconnects_to:\n  - Ontology\n  - Plan\n  - data agent\n  - reports\nretail_example: The measure [Net Sales] becomes a metric on the entity type Order when you generate the ontology from the 'Store Sales' semantic model.\nlimits: You need Read and Build permissions to generate or bind an ontology from it. During preview, the ontology agent does not bind entities directly to semantic models. The data agent fails with ontologies that use semantic model bindings. Semantic models support public network access only for the Foundry Fabric IQ tool.\nstatus: GA for the semantic model. Its use inside the ontology is preview."},{"i":"L5.components.6","l":5,"t":"L5 > components > Ontology agent","x":"name: Ontology agent\npurpose: Help you create, improve, and query an ontology in natural language inside the ontology item.\ninputs: Connected lakehouses, eventhouses, and semantic models, plus your prompts and up to 10 files of 5 MB each.\noutputs: Draft entity types, relationships, bindings, and patches. In Plan mode it only queries and previews. In Act mode it applies changes.\nconnects_to:\n  - Ontology\n  - Graph\n  - OneLake data\n  - Power BI semantic model\nretail_example: You ask it to combine the semantic models 'Store Sales' and 'Returns' into one retail ontology, and you review the draft before you apply it.\nlimits: One ontology and one workspace per conversation. Conversations end when you close the browser tab, and cannot exceed 24 hours. No built-in rollback. Outside US and EU Data Boundary capacities, it needs a cross-geo tenant setting.\nstatus: Preview (How to use the ontology agent, Microsoft Learn, updated 2026-09-29)."},{"i":"L5.ontology_detail.parts.0","l":5,"t":"L5 > ontology_detail > parts > 0","x":"part: Entity type\nmeaning: The reusable definition of one business concept. It must have a key property of type string or integer.\nretail_example: Store, with the key 'StoreCode'."},{"i":"L5.ontology_detail.parts.1","l":5,"t":"L5 > ontology_detail > parts > 1","x":"part: Property\nmeaning: A named characteristic of an entity type, with a data type. Supported types are string, integer, double, boolean, and datetime.\nretail_example: Product.Name (string), Product.Price (double). Do not use Decimal, because Graph returns nulls for it."},{"i":"L5.ontology_detail.parts.2","l":5,"t":"L5 > ontology_detail > parts > 2","x":"part: Entity instance\nmeaning: One data-backed occurrence of an entity type. The Instances tab shows its static property values.\nretail_example: The store 'Chennai Main Road' with StoreCode 'CH01'."},{"i":"L5.ontology_detail.parts.3","l":5,"t":"L5 > ontology_detail > parts > 3","x":"part: Relationship (relationship type)\nmeaning: A named, directed connection between two entity types. You must bind it to data and give it a unique name.\nretail_example: Store receives Order, through ord_hdr.st_cd = stores.store_code."},{"i":"L5.ontology_detail.parts.4","l":5,"t":"L5 > ontology_detail > parts > 4","x":"part: Data binding\nmeaning: A map from ontology definitions to source tables and columns. The data stays in the source. A primary binding supplies the main table, and an additional binding adds a second table through a common column.\nretail_example: Order binds to ord_hdr. A second binding adds the table 'order_channel' through ord_no."},{"i":"L5.ontology_detail.parts.5","l":5,"t":"L5 > ontology_detail > parts > 5","x":"part: Static data and time-series data\nmeaning: Static properties come from ordinary columns. Time-series data uses a timestamp column (datetime, date, or timestamp in a lakehouse; datetime in an eventhouse). Generation from a semantic model does not bind time-series data automatically.\nretail_example: Product.Category is static. StockLevel.Units with the timestamp column 'event_time' from the eventhouse is time-series data."},{"i":"L5.ontology_detail.parts.6","l":5,"t":"L5 > ontology_detail > parts > 6","x":"part: Rule (business rule)\nmeaning: A name and a natural-language definition, with optional links to entity types, properties, and relationships. It grounds agent answers. The ontology does not run it.\nretail_example: 'Net sales excludes orders with Status X and subtracts RefundAmount.' Linked to Order.Status and Order.RefundAmount."},{"i":"L5.ontology_detail.parts.7","l":5,"t":"L5 > ontology_detail > parts > 7","x":"part: Metric\nmeaning: A calculation on an entity type. Generation from a semantic model turns DAX measures into metrics.\nretail_example: The measure [Net Sales] becomes the metric 'Net Sales' on Order."},{"i":"L5.ontology_detail.parts.8","l":5,"t":"L5 > ontology_detail > parts > 8","x":"part: Inheritance (lineage view)\nmeaning: Entity types can inherit from other entity types. The canvas has a lineage view for this structure.\nretail_example: OnlineOrder and StoreOrder inherit from Order. Note: the MCP server cannot query a parent entity for inheriting entities (known issue)."},{"i":"L5.ontology_detail.ways_to_create.0","l":5,"t":"L5 > ontology_detail > ways_to_create > 0","x":"way: Generate from a Power BI semantic model\nwhen_to_use: You already have a trusted semantic model. Tables become entity types, columns become properties with bindings, relationships become relationship types, and DAX measures become metrics. You must still bind time-series data and relationships, check keys, and rename items.\nverified_source: Generate an ontology from a semantic model (preview), Microsoft Learn, updated 2026-09-29"},{"i":"L5.ontology_detail.ways_to_create.1","l":5,"t":"L5 > ontology_detail > ways_to_create > 1","x":"way: Create manually (from scratch), then bind to OneLake sources\nwhen_to_use: You want full control, or the business concepts do not match the tables of one model. You define entity types and then bind them to lakehouse, eventhouse, or other tables.\nverified_source: Ontology overview, Microsoft Learn, updated 2026-10-16; Data binding in ontology (preview), updated 2026-10-21"},{"i":"L5.ontology_detail.ways_to_create.2","l":5,"t":"L5 > ontology_detail > ways_to_create > 2","x":"way: Use the ontology agent on connected Fabric sources\nwhen_to_use: You want a draft quickly, or you must combine several semantic models. A second semantic model can go into an existing ontology only through the ontology agent.\nverified_source: How to use the ontology agent (preview), Microsoft Learn, updated 2026-09-29; Generate an ontology from a semantic model, updated 2026-09-29"},{"i":"L5.ontology_detail.ways_to_create.3","l":5,"t":"L5 > ontology_detail > ways_to_create > 3","x":"way: Import RDF, Turtle, or OWL definitions into an empty ontology\nwhen_to_use: The company already has an ontology in a standard format.\nverified_source: Ontology overview, Microsoft Learn, updated 2026-10-16"},{"i":"L5.ontology_detail.ways_to_create.4","l":5,"t":"L5 > ontology_detail > ways_to_create > 4","x":"way: Note on 'from OneLake data'\nwhen_to_use: Microsoft Learn does not name 'from OneLake data' as a separate creation path. OneLake tables, shortcuts, views, and materialized views are binding sources for the manual and agent paths.\nverified_source: Ontology overview, Microsoft Learn, updated 2026-10-16"},{"i":"L5.ontology_detail.retail_ontology_sketch.p0","l":5,"t":"L5 > ontology_detail > retail_ontology_sketch","x":"ontology: RetailOntology            # item in workspace 'Store Sales'\nentity_types:\n  Customer:\n    key: CustomerId (string)\n    properties: [Name (string), LoyaltyTier (string), City (string)]\n    binding: SalesLakehouse.customers\n  Store:\n    key: StoreCode (string)\n    properties: [Name (string), Region (string)]\n    binding: SalesLakehouse.stores (store_code, store_name, region)\n  Product:\n    key: ProductId (string)\n    properties: [Name (string), Category (string), Price (double)]\n    binding: SalesLakehouse.products (prd_id, prd_nm, cat, unit_price)\n  Order:\n    key: OrderNo (integer)\n    properties: [Status (string), Amount (double), RefundAmount (double), OrderDate (datetime)]\n    binding: SalesLakehouse.ord_hdr (ord_no, sts, amt, ref_amt, ord_dt)\n    metrics: [Net Sales (from semantic model measure, optional)]\n  StockLevel:\n    key: StockId (string)\n    properties: [Units (integer)]\n    time_series: StockEvents.stock (timestamp: event_time)    # eventhouse\nrelationships:\n  - Customer places Order        (ord_hdr.cust_id = customers.cust_id)\n  - Store receives Order         (ord_hdr.st_cd = stores.store_code)\n  - Order contains Product       (ord_line.ord_no, ord_line.prd_id)\n  - Store holds StockLevel       (stock.st_cd = stores.store_code)\n  - StockLevel measures Product  (stock.prd_id = products.prd_id)\nrules:                            # text for agents; the ontology does not run them\n  - Net sales: Amount minus RefundAmount; exclude Status 'X' (cancelled).\n  - L"},{"i":"L5.ontology_detail.retail_ontology_sketch.p1","l":5,"t":"L5 > ontology_detail > retail_ontology_sketch","x":"ow stock: a StockLevel with fewer than 10 Units for a Product in a Store.\n  - Store codes: StoreCode 'CH01' is the store 'Chennai Main Road'.\nalerts: set up separately (operations agent or Activator), not inside the rules\n"},{"i":"L5.build_path.0","l":5,"t":"L5 > build_path > 0","x":"step: 1\naction: Ask the Fabric administrator to turn on the tenant settings 'Users can create ontology (preview) items' and 'Users can create Fabric items'.\nfrom: Admin portal (tenant settings)\nproduces: Permission to create ontology items in the tenant.\nstatus: Verified (Data binding and Generate pages, Microsoft Learn, 2026-09-29 to 2026-10-21)."},{"i":"L5.build_path.1","l":5,"t":"L5 > build_path > 1","x":"step: 2\naction: Confirm a paid capacity. Use F2 or larger for the data agent and MCP. Microsoft Learn suggests F8 to evaluate the ontology. Do not use the trial for the operations agent.\nfrom: Capacity 'Retail-F64'\nproduces: A capacity that supports all Fabric IQ items in this lesson.\nstatus: Verified (data agent concepts 2026-05-11; ontology capacity usage 2026-10-14; operations agent 2026-10-21)."},{"i":"L5.build_path.2","l":5,"t":"L5 > build_path > 2","x":"step: 3\naction: Clean the source tables. Convert Decimal columns to double. Use managed lakehouse tables, not external tables. Give each table a clear key.\nfrom: Lakehouse 'SalesLakehouse' and eventhouse 'StockEvents'\nproduces: Tables that bind without errors.\nstatus: Verified from known issues (Ontology troubleshooting, Microsoft Learn, updated 2026-10-01)."},{"i":"L5.build_path.3","l":5,"t":"L5 > build_path > 3","x":"step: 4\naction: Create the ontology. Generate it from the 'Store Sales' semantic model, or create it manually, or use the ontology agent.\nfrom: Power BI semantic model 'Store Sales', or nothing (manual), or connected sources (agent)\nproduces: Ontology item 'RetailOntology' with entity types, properties, relationship types, and metrics.\nstatus: Preview."},{"i":"L5.build_path.4","l":5,"t":"L5 > build_path > 4","x":"step: 5\naction: Bind data. Bind Order to ord_hdr, Store to stores, and StockLevel to the eventhouse with the timestamp column. Bind each relationship.\nfrom: Lakehouse and eventhouse tables\nproduces: Entity instances that you can see on the Instances tab.\nstatus: Preview."},{"i":"L5.build_path.5","l":5,"t":"L5 > build_path > 5","x":"step: 6\naction: Rename items to business names, add synonyms, and write rules for net sales, low stock, and store codes.\nfrom: Business owners (sales and finance)\nproduces: Rules and names that agents read as context.\nstatus: Preview."},{"i":"L5.build_path.6","l":5,"t":"L5 > build_path > 6","x":"step: 7\naction: Test with the ontology agent in Plan mode. Compare its answers with the 'Daily Store Sales' report.\nfrom: Ontology 'RetailOntology'\nproduces: Known-answer tests, for example net sales of CH01 = 2000.0.\nstatus: Preview."},{"i":"L5.build_path.7","l":5,"t":"L5 > build_path > 7","x":"step: 8\naction: Create a data agent, add the ontology as a source, and add agent instructions and example queries on the underlying sources.\nfrom: Ontology and its underlying lakehouse\nproduces: Data agent 'Store Manager Assistant' for store managers.\nstatus: Preview for ontology as a source."},{"i":"L5.build_path.8","l":5,"t":"L5 > build_path > 8","x":"step: 9\naction: Create an operations agent on the eventhouse or the ontology, with a low-stock rule and a Teams recipient.\nfrom: Eventhouse 'StockEvents' or ontology 'RetailOntology'\nproduces: Teams alerts and recommended actions.\nstatus: Mixed (GA on the Release status page; new functions preview)."},{"i":"L5.build_path.9","l":5,"t":"L5 > build_path > 9","x":"step: 10\naction: Optionally, connect external agents through the ontology MCP server, and create a plan item for the 2027 budget.\nfrom: Ontology item IDs (MCP); semantic model 'Store Sales' (Plan)\nproduces: External agent access to the ontology, and a budget written to a SQL database in Fabric.\nstatus: MCP: preview. Plan: probably GA."},{"i":"L5.build_path.10","l":5,"t":"L5 > build_path > 10","x":"step: 11\naction: Watch the Capacity Metrics app for ontology, Graph, data agent, and operations agent meters.\nfrom: Capacity Metrics app\nproduces: A measured CU cost per component.\nstatus: Verified meters (see cost_and_capacity)."},{"i":"L5.runtime_flow.data_agent_example","l":5,"t":"L5 > runtime_flow > data_agent_example","x":"question: What were the net sales of the Chennai Main Road store last week?\nsteps:\n  - The data agent checks the question against responsible AI policies, Microsoft Purview controls, and the permissions of the store manager.\n  - The agent reads the ontology context: Store, Order, the relationship 'Store receives Order', and the rule 'Net sales'.\n  - The agent maps 'Chennai Main Road' to StoreCode 'CH01' and 'net sales' to Amount minus RefundAmount, without Status 'X'.\n  - The agent chooses one underlying source, the lakehouse 'SalesLakehouse'. It does not join across sources.\n  - The agent writes a SQL query on ord_hdr and stores, and validates it.\n  - The lakehouse runs the query with the identity of the store manager, so OneLake security row rules apply.\n  - The agent formats the result and shows it.\nanswer: Net sales of Chennai Main Road last week: 2000.0. The agent excluded order 10022 (cancelled) and subtracted a refund of 200.0 from order 10023."},{"i":"L5.runtime_flow.operations_agent_example","l":5,"t":"L5 > runtime_flow > operations_agent_example","x":"condition: StockLevel.Units for a Product in a Store is below 10 (a state condition 'Is below 10'), or crosses below 10 (a transition condition).\nsteps:\n  - The creator sets the goal, the instructions, the data source (eventhouse or ontology), and the rule.\n  - After activation, the agent runs the rule as a query every 5 minutes. This uses CUs
