<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gru13 · Pages Index</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e6e8ee; --muted:#8b92a5; --accent:#6ea8fe; --border:#262a35; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7fb; --card:#fff; --text:#1c2030; --muted:#6b7285; --accent:#2563eb; --border:#e3e6ef; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:1.8rem; }
  .sub { color:var(--muted); margin:0 0 20px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
          background:var(--card); color:var(--text); font-size:1rem; margin-bottom:20px; }
  h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:24px 0 8px; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  a { display:flex; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--card);
      border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none; }
  a:hover { border-color:var(--accent); }
  a .name { color:var(--accent); font-weight:600; }
  a .path { color:var(--muted); font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msg { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>gru13's pages</h1>
  <p class="sub" id="count">Loading…</p>
  <input id="q" type="search" placeholder="Search pages…" autocomplete="off">
  <div id="list"></div>
</main>

<script>
  // ---- config ----
  const OWNER = "gru13";
  const REPO  = "gru13.github.io";
  const EXCLUDE = ["index.html"];   // files to hide (root index only)
  // ----------------

  const $list = document.getElementById("list");
  const $count = document.getElementById("count");
  const $q = document.getElementById("q");
  let pages = [];

  const prettify = p => p.split("/").pop().replace(/\.html$/i, "").replace(/[-_]+/g, " ");

  async function load() {
    const cacheKey = "pages-index-v1";
    try {
      const c = JSON.parse(sessionStorage.getItem(cacheKey));
      if (c && Date.now() - c.t < 5 * 60e3) return c.data;
    } catch {}
    const repo = await (await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`)).json();
    const tree = await (await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${repo.default_branch}?recursive=1`)).json();
    const data = tree.tree
      .filter(f => f.type === "blob" && /\.html$/i.test(f.path) && !EXCLUDE.includes(f.path))
      .map(f => f.path);
    try { sessionStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), data })); } catch {}
    return data;
  }

  function render() {
    const term = $q.value.trim().toLowerCase();
    const shown = pages.filter(p => p.toLowerCase().includes(term));
    $count.textContent = `${shown.length} of ${pages.length} pages`;
    if (!shown.length) { $list.innerHTML = '<p class="msg">No matches.</p>'; return; }

    const groups = {};
    shown.forEach(p => {
      const dir = p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "Root";
      (groups[dir] ||= []).push(p);
    });

    $list.innerHTML = Object.keys(groups).sort((a, b) => a === "Root" ? -1 : b === "Root" ? 1 : a.localeCompare(b))
      .map(dir => `<h2>${dir}</h2><ul>` +
        groups[dir].sort().map(p =>
          `<li><a href="${encodeURI(p)}"><span class="name">${prettify(p)}</span><span class="path">${p}</span></a></li>`
        ).join("") + `</ul>`).join("");
  }

  load().then(d => { pages = d; render(); })
        .catch(() => { $count.textContent = ""; $list.innerHTML = '<p class="msg">Couldn\'t load the page list (GitHub API rate limit?). Try again in a bit.</p>'; });
  $q.addEventListener("input", render);
</script>
</body>
</html>
